<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reindeer Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0d1530;font-family:'Fredoka',system-ui,sans-serif;}
canvas{display:block;}

.hud{position:fixed;pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);z-index:5;}
#camLabel{top:16px;left:18px;font-family:'Luckiest Guy',cursive;font-size:clamp(.9rem,1.8vw,1.4rem);letter-spacing:.04em;color:#f4c95d;}
#camLabel .rec{color:#e23b4e;}
#leader{top:16px;right:18px;text-align:right;font-size:clamp(.85rem,1.5vw,1.2rem);font-weight:600;}
#leader b{color:#f4c95d;}
#timer{top:44px;right:18px;text-align:right;font-size:clamp(.7rem,1.2vw,1rem);color:#c6d2ec;font-variant-numeric:tabular-nums;}

.camBar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:.45rem;z-index:6;}
.camBar button{
  pointer-events:auto;cursor:pointer;border:none;font-family:'Fredoka';font-weight:600;
  background:rgba(15,22,50,.75);color:#c6d2ec;border:1px solid rgba(255,255,255,.18);
  padding:.4rem .9rem;border-radius:999px;font-size:clamp(.65rem,1.1vw,.9rem);backdrop-filter:blur(8px);transition:all .15s;
}
.camBar button.active{background:#f4c95d;color:#1a1340;border-color:#f4c95d;}

.overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(13,21,48,.55),rgba(13,21,48,.90));backdrop-filter:blur(4px);
}
.overlay.off{display:none;}
.card{text-align:center;color:#fff;}
.card h1{
  font-family:'Luckiest Guy',cursive;font-size:clamp(2rem,5.5vw,4rem);line-height:1;
  text-shadow:0 3px 0 #e23b4e,0 0 30px rgba(127,168,255,.45);
}
.card h1 .g{color:#f4c95d;text-shadow:0 0 22px rgba(244,201,93,.8);}
.card .sub{color:#c6d2ec;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(.65rem,1.1vw,.9rem);margin:.6rem 0 .4rem;}
.progress{width:220px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin:.8rem auto 1.4rem;overflow:hidden;}
.progress .bar{height:100%;background:#f4c95d;border-radius:4px;transition:width .3s ease;width:0%;}
.count{font-family:'Luckiest Guy',cursive;font-size:clamp(5rem,16vw,12rem);color:#f4c95d;text-shadow:0 0 40px rgba(244,201,93,.7),0 5px 0 #e23b4e;animation:pop .85s ease;}
@keyframes pop{0%{transform:scale(.25);opacity:0;}40%{transform:scale(1.18);}100%{transform:scale(1);opacity:1;}}

.bigBtn{
  font-family:'Luckiest Guy',cursive;cursor:pointer;border:none;color:#2a1209;
  background:linear-gradient(180deg,#f4c95d,#d9a233);padding:.75rem 2rem;
  font-size:clamp(1rem,2vw,1.5rem);border-radius:999px;letter-spacing:.04em;
  box-shadow:0 6px 0 #8a6418,0 10px 22px rgba(0,0,0,.4);display:none;
}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6418;}

.resultCard{
  background:linear-gradient(180deg,#241a52,#141c3c);border:2px solid rgba(244,201,93,.45);
  border-radius:20px;padding:clamp(1.2rem,3vw,2.2rem);width:min(540px,86vw);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.resultCard h2{font-family:'Luckiest Guy',cursive;color:#f4c95d;font-size:clamp(1.5rem,3.5vw,2.4rem);margin-bottom:.9rem;}
.rrow{display:flex;align-items:center;gap:.6rem;padding:.28rem .15rem;border-bottom:1px solid rgba(255,255,255,.07);font-size:clamp(.8rem,1.4vw,1rem);}
.rrow .pos{font-family:'Luckiest Guy',cursive;color:#f4c95d;width:2em;}
.rrow .swatch{width:.85em;height:.85em;border-radius:3px;flex-shrink:0;}
.rrow .nm{font-weight:600;color:#e9eefc;}
.credit{margin-top:1rem;font-size:.72rem;color:#7884a8;line-height:1.4;}
</style>
</head>
<body>

<div class="hud" id="camLabel"><span class="rec">●</span> AERIAL</div>
<div class="hud" id="leader"></div>
<div class="hud" id="timer"></div>

<div class="camBar" id="camBar">
  <button data-cam="auto" class="active">Auto</button>
  <button data-cam="aerial">Aerial</button>
  <button data-cam="chase">Chase</button>
  <button data-cam="rail">Rail</button>
  <button data-cam="finish">Finish</button>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h1>The <span class="g">Reindeer</span> Dash</h1>
    <p class="sub">9 runners · 1 winner · pure chaos</p>
    <div class="progress"><div class="bar" id="loadBar"></div></div>
    <div id="loadMsg" style="color:#c6d2ec;font-size:.9rem;margin-bottom:1.2rem">Loading reindeer… 0/9</div>
    <button class="bigBtn" id="startBtn">Start Race</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const NAMES=['Dasher','Dancer','Prancer','Vixen','Comet','Cupid','Donner','Blitzen','Rudolph'];
const COLORS=['#c47a3a','#b86d45','#d49050','#a05c2e','#c88048','#b07040','#d4a060','#985030','#e03020'];
const N=9, TRACK_LEN=185, FINISH_Z=172, START_Z=5, LANE_W=2.5, BASE_SPEED=3.0;

let scene,camera,renderer,clock;
let deerObjs=new Array(N).fill(null), deerLoaded=0, deerScale=1, autoScaleDone=false;
let racing=false, raceTime=0, finishCounter=0, finishedAll=false, postTimer=0;
let camMode='auto', autoPick='aerial', autoCutTimer=0;
const camPos=new THREE.Vector3(0,28,-20), camAim=new THREE.Vector3(0,2,30);
let snowGeo;

const overlay=document.getElementById('overlay');
const loadBar=document.getElementById('loadBar');
const loadMsg=document.getElementById('loadMsg');
const startBtn=document.getElementById('startBtn');
const camLabel=document.getElementById('camLabel');
const leaderEl=document.getElementById('leader');
const timerEl=document.getElementById('timer');

/* ── INIT ────────────────────────────────────────────── */
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8aadd4);
  scene.fog=new THREE.Fog(0x8aadd4,55,230);

  camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,0.1,600);
  camera.position.copy(camPos);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  clock=new THREE.Clock();

  // Lighting
  const hemi=new THREE.HemisphereLight(0xd4eaff,0x6a7a90,0.9);
  scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xfff0d6,1.3);
  sun.position.set(-55,65,25);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-70; sun.shadow.camera.right=70;
  sun.shadow.camera.top=70; sun.shadow.camera.bottom=-70;
  sun.shadow.camera.near=1; sun.shadow.camera.far=200;
  scene.add(sun);

  buildGround(); buildScenery(); buildSnow();
  loadAllDeer();

  document.querySelectorAll('.camBar button').forEach(b=>b.addEventListener('click',()=>{
    camMode=b.dataset.cam;
    document.querySelectorAll('.camBar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }));
  startBtn.addEventListener('click',beginRace);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  animate();
}

/* ── GROUND & TRACK ─────────────────────────────────── */
function buildGround(){
  const snowMat=new THREE.MeshStandardMaterial({color:0xddeeff,roughness:0.95});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,TRACK_LEN+140),snowMat);
  ground.rotation.x=-Math.PI/2; ground.position.z=TRACK_LEN/2; ground.receiveShadow=true;
  scene.add(ground);

  const railMat=new THREE.MeshStandardMaterial({color:0xfafcff,roughness:0.6});
  const postMat=new THREE.MeshStandardMaterial({color:0xcc3344});
  const tw=N*LANE_W/2+2.5;
  [-1,1].forEach(s=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.85,TRACK_LEN+8),railMat);
    rail.position.set(s*tw,0.85,TRACK_LEN/2); rail.castShadow=true; scene.add(rail);
    for(let z=0;z<=TRACK_LEN+4;z+=8){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,1.3,8),postMat);
      p.position.set(s*tw,0.65,z); scene.add(p);
    }
  });
  // Finish gantry
  [-1,1].forEach(s=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,9,10),postMat);
    pole.position.set(s*(tw+1),4.5,FINISH_Z); scene.add(pole);
  });
  const banner=new THREE.Mesh(new THREE.BoxGeometry(tw*2+2,2.2,0.25),
    new THREE.MeshStandardMaterial({color:0x155724}));
  banner.position.set(0,8.5,FINISH_Z); scene.add(banner);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(tw*2,1.8),
    new THREE.MeshStandardMaterial({color:0x111111,roughness:0.8}));
  fl.rotation.x=-Math.PI/2; fl.position.set(0,0.02,FINISH_Z); scene.add(fl);
}

/* ── SCENERY ─────────────────────────────────────────── */
function makeTree(x,z,s){
  const g=new THREE.Group();
  const trunkM=new THREE.MeshStandardMaterial({color:0x5a3a22,roughness:.9});
  const fM=new THREE.MeshStandardMaterial({color:0x2a6840,roughness:.85});
  const capM=new THREE.MeshStandardMaterial({color:0xddeeff,roughness:.7});
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.3*s,1.5*s,7),trunkM);
  tr.position.y=.75*s; tr.castShadow=true; g.add(tr);
  for(let i=0;i<3;i++){
    const c=new THREE.Mesh(new THREE.ConeGeometry((2-i*.45)*s,(2.2-i*.25)*s,9),fM);
    c.position.y=(1.9+i*1.45)*s; c.castShadow=true; g.add(c);
    const cap=new THREE.Mesh(new THREE.ConeGeometry((2.05-i*.45)*s,.45*s,9),capM);
    cap.position.y=(2.7+i*1.45)*s; g.add(cap);
  }
  g.position.set(x,0,z); return g;
}
function buildScenery(){
  for(let i=0;i<42;i++){
    const s=Math.random()<.5?-1:1;
    const x=s*(N*LANE_W/2+6+Math.random()*50);
    const z=Math.random()*(TRACK_LEN+60)-15;
    scene.add(makeTree(x,z,.7+Math.random()*1.5));
  }
  for(let i=0;i<9;i++){
    const m=new THREE.Mesh(new THREE.ConeGeometry(35+Math.random()*35,38+Math.random()*45,5),
      new THREE.MeshStandardMaterial({color:0xb0c4de,roughness:1}));
    m.position.set((Math.random()-.5)*420,0,TRACK_LEN+110+Math.random()*60); scene.add(m);
  }
}

/* ── SNOW PARTICLES ─────────────────────────────────── */
function buildSnow(){
  snowGeo=new THREE.BufferGeometry();
  const cnt=700, arr=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){arr[i*3]=(Math.random()-.5)*130;arr[i*3+1]=Math.random()*65;arr[i*3+2]=Math.random()*TRACK_LEN;}
  snowGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xffffff,size:.5,transparent:true,opacity:.8,depthWrite:false})));
}

/* ── LOAD DEER ───────────────────────────────────────── */
function loadAllDeer(){
  const loader=new THREE.GLTFLoader();
  for(let i=0;i<N;i++){
    (function(idx){
      loader.load('./scene.gltf',
        gltf=>onLoaded(gltf,idx),
        null,
        err=>{console.error('Load error deer',idx,err);}
      );
    })(i);
  }
}

function onLoaded(gltf,idx){
  // Auto-scale once from first model loaded
  if(!autoScaleDone){
    autoScaleDone=true;
    const box=new THREE.Box3().setFromObject(gltf.scene);
    const h=box.getSize(new THREE.Vector3()).y;
    deerScale=h>0.01 ? 4.0/h : 0.01;
    console.log('Auto deer scale:',deerScale.toFixed(4),'(source height:',h.toFixed(3),'m)');
  }
  gltf.scene.scale.setScalar(deerScale);

  // Face down-track. If deer runs backwards, change Math.PI → 0
  gltf.scene.rotation.y=0;

  // Colour — multiply base material color by our deer colour
  const tint=new THREE.Color(COLORS[idx]);
  gltf.scene.traverse(n=>{
    if(!n.isMesh) return;
    const orig=Array.isArray(n.material)?n.material[0]:n.material;
    const mat=orig.clone();
    const lum=mat.color.r+mat.color.g+mat.color.b;
    if(lum>0.25) mat.color.multiply(tint); // skip very dark materials (eyes)
    mat.roughness=0.75; mat.metalness=0.0;
    n.material=mat; n.castShadow=true; n.receiveShadow=true;
  });
  // Rudolph's glowing red nose — lives in world space, tracked to head each frame
  if(idx===8){
    const noseMat=new THREE.MeshStandardMaterial({color:0xff2233,emissive:0xff1122,emissiveIntensity:2.5,roughness:.2});
    const nose=new THREE.Mesh(new THREE.SphereGeometry(0.28,14,14),noseMat);
    const nosePt=new THREE.PointLight(0xff3344,3.0,8);
    const noseG=new THREE.Group(); noseG.add(nose); noseG.add(nosePt);
    scene.add(noseG);
    let headNode=null;
    gltf.scene.traverse(nd=>{if(!headNode&&nd.name&&nd.name.toLowerCase().includes('head')) headNode=nd;});
    gltf._noseG=noseG; gltf._headNode=headNode;
  }

  // Normalize clip — shift all keyframe times so the clip starts at t=0.
  // The exporter packed Idle/Walk/Run sequentially; Rundeer keyframes sit
  // at t=4.667-5.267, causing a long silent period before the gallop.
  function normalizeClip(clip){
    let minT=Infinity;
    clip.tracks.forEach(tr=>{ if(tr.times.length) minT=Math.min(minT,tr.times[0]); });
    if(minT>0){
      clip.tracks.forEach(tr=>{
        for(let i=0;i<tr.times.length;i++) tr.times[i]-=minT;
      });
    }
    clip.resetDuration();
    return clip;
  }

  // Animation mixer — run + idle actions
  const mixer=new THREE.AnimationMixer(gltf.scene);
  const runClip=normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'Rundeer'));
  const idleClip=normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'IdleDeer'));
  const action=mixer.clipAction(runClip);
  const idleAction=mixer.clipAction(idleClip);
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.play(); action.paused=true;
  idleAction.play(); idleAction.paused=true;

  const lane=(idx-(N-1)/2)*LANE_W;
  gltf.scene.position.set(lane,0,START_Z);
  scene.add(gltf.scene);

  deerObjs[idx]={
    group:gltf.scene, mixer, action, idleAction,
    noseGroup:gltf._noseG||null, headNode:gltf._headNode||null,
    lane, z:START_Z, speed:0, flyTimer:0,
    base:0, surgeF:0, surgeP:0, amp:0,
    place:0, finished:false, name:NAMES[idx]
  };

  deerLoaded++;
  loadBar.style.width=(deerLoaded/N*100)+'%';
  loadMsg.textContent=`Loading reindeer… ${deerLoaded}/${N}`;
  if(deerLoaded===N){
    loadMsg.textContent='Ready!';
    startBtn.style.display='block';
  }
}

/* ── RACE SETUP ──────────────────────────────────────── */
function configureRace(){
  deerObjs.forEach(d=>{
    d.z=START_Z; d.place=0; d.finished=false; d.flyTimer=0;
    d.flightProgress=-1; d.flightMaxAlt=0; d.flightDuration=0;
    d.nextFlightAt=2.5+Math.random()*4.0;
    d.base=7.0+Math.random()*4.5;
    d.surgeF=0.45+Math.random()*1.3;
    d.surgeP=Math.random()*Math.PI*2;
    d.amp=0.20+Math.random()*0.35;
    d.speed=d.base;
    d.group.position.set(d.lane,0,START_Z);
    d.group.rotation.y=0;
    d.idleAction.stop();
    d.action.reset().play(); d.action.paused=false;
    d.mixer.setTime(Math.random()*2);
    d.mixer.timeScale=1;
  });
}

function beginRace(){
  configureRace();
  raceTime=0; finishCounter=0; finishedAll=false; postTimer=0;
  showCountdown(()=>{
    racing=true;
    overlay.classList.add('off');
  });
}

/* ── COUNTDOWN ───────────────────────────────────────── */
function showCountdown(done){
  overlay.classList.remove('off');
  overlay.innerHTML='<div class="card"><div class="count" id="cnum">3</div></div>';
  const el=()=>document.getElementById('cnum');
  const seq=['3','2','1','GO!'];
  let i=0;
  function step(){
    if(i<seq.length){
      el().textContent=seq[i];
      el().style.animation='none'; void el().offsetWidth; el().style.animation='pop .85s ease';
      i++;
      setTimeout(step,750);
    } else { done(); }
  }
  setTimeout(step,300);
}

/* ── RACE UPDATE ─────────────────────────────────────── */
function leaderDeer(){let b=null;deerObjs.forEach(d=>{if(!b||d.z>b.z)b=d;});return b;}
function packCenter(){let z=0,x=0;deerObjs.forEach(d=>{z+=d.z;x+=d.lane;});return{z:z/N,x:x/N};}

function updateRace(dt){
  raceTime+=dt;
  deerObjs.forEach(d=>{
    if(d.finished){
      d.group.position.y=0;
      d.mixer.timeScale=0.7;
      d.mixer.update(dt);
      return;
    }
    const surge=1+d.amp*Math.sin(d.surgeF*raceTime+d.surgeP);
    const jit=0.92+Math.random()*0.16;
    d.speed=Math.max(1.5,d.base*surge*jit);
    d.z+=d.speed*dt;
    d.mixer.timeScale=1.5;
    d.mixer.update(dt);

    // Random brief elevations — deer occasionally lifts off and returns
    if(d.flightProgress<0){
      if(raceTime>=d.nextFlightAt){
        d.flightProgress=0;
        d.flightDuration=1.4+Math.random()*2.0;   // 1.4–3.4s per flight
        d.flightMaxAlt=2.0+Math.random()*5.0;     // peak 2–7m
      }
      d.group.position.y=0;
    } else {
      d.flightProgress+=dt/d.flightDuration;
      if(d.flightProgress>=1){
        d.flightProgress=-1;
        d.group.position.y=0;
        d.nextFlightAt=raceTime+1.5+Math.random()*4.0;  // next in 1.5–5.5s
      } else {
        // sin curve: smooth rise to peak then back to ground
        d.group.position.y=Math.sin(d.flightProgress*Math.PI)*d.flightMaxAlt;
      }
    }

    d.group.position.z=Math.min(d.z,FINISH_Z);
    if(d.z>=FINISH_Z){
      d.z=FINISH_Z; d.finished=true; d.place=++finishCounter;
      d.group.position.y=0;            // land on the finish line
      d.flightProgress=-1;             // cancel any in-progress flight
      d.idleAction.reset().play();
      d.action.crossFadeTo(d.idleAction,0.4,false);
    }
  });

  // Track Rudolph's nose to his head in world space
  const rud=deerObjs[8];
  if(rud&&rud.noseGroup){
    if(rud.headNode){
      const wp=new THREE.Vector3();
      rud.headNode.getWorldPosition(wp);
      rud.noseGroup.position.copy(wp);
      rud.noseGroup.position.z+=0.7;   // forward toward snout tip — tune if needed
      rud.noseGroup.position.y+=0.15;  // up out of jaw — tune if needed
    } else {
      rud.noseGroup.position.set(rud.lane, rud.group.position.y+3.4, rud.group.position.z+1.8);
    }
  }

  const ld=leaderDeer();
  if(ld) leaderEl.innerHTML=finishCounter>0
    ?'LEADER <b>'+(deerObjs.find(x=>x.place===1)||ld).name.toUpperCase()+'</b>'
    :'LEADER <b>'+ld.name.toUpperCase()+'</b>';
  timerEl.textContent=raceTime.toFixed(1)+'s';

  if(finishCounter>=N&&!finishedAll){finishedAll=true;}
  if(finishedAll){postTimer+=dt;if(postTimer>2.0){racing=false;showResults();}}
}

/* ── CAMERA DIRECTOR ─────────────────────────────────── */
function directCamera(dt){
  let mode=camMode;
  if(mode==='auto'){
    autoCutTimer-=dt;
    const ld=leaderDeer();
    if(ld&&ld.z>FINISH_Z-50) autoPick='finish';
    else if(autoCutTimer<=0){
      const pool=['aerial','chase','rail','aerial','chase','aerial'];
      autoPick=pool[Math.floor(Math.random()*pool.length)];
      autoCutTimer=3.0+Math.random()*2.5;
    }
    mode=autoPick;
  }
  const ld=leaderDeer(), pc=packCenter();
  let tp=new THREE.Vector3(), ta=new THREE.Vector3();

  if(mode==='aerial'){
    tp.set(pc.x*.3,28,pc.z-28); ta.set(pc.x*.3,1.5,pc.z+14);
    camLabel.innerHTML='<span class="rec">●</span> AERIAL';
  } else if(mode==='chase'){
    tp.set(ld.lane*.5,4.5,ld.z-10); ta.set(ld.lane*.4,2.0,ld.z+9);
    camLabel.innerHTML='<span class="rec">●</span> CHASE — '+ld.name.toUpperCase();
  } else if(mode==='rail'){
    const s=pc.x>=0?-1:1;
    tp.set(s*(N*LANE_W/2+11),3.5,pc.z+6); ta.set(pc.x,1.8,pc.z);
    camLabel.innerHTML='<span class="rec">●</span> RAIL CAM';
  } else {
    tp.set(N*LANE_W/2+7,4,FINISH_Z+14); ta.set(0,2,FINISH_Z-8);
    camLabel.innerHTML='<span class="rec">●</span> FINISH LINE';
  }
  const k=(mode==='finish'||mode==='rail')?3.5:2.0;
  const a=1-Math.exp(-k*dt);
  camPos.lerp(tp,a); camAim.lerp(ta,a);
  camera.position.copy(camPos); camera.lookAt(camAim);
}

/* ── RESULTS ─────────────────────────────────────────── */
function showResults(){
  const order=[...deerObjs].sort((a,b)=>a.place-b.place);
  const rows=order.map(d=>`<div class="rrow">
    <span class="pos">${d.place}</span>
    <span class="swatch" style="background:${COLORS[NAMES.indexOf(d.name)]}"></span>
    <span class="nm">${d.name}${d.name==='Rudolph'?' 🔴':''}</span>
  </div>`).join('');
  overlay.innerHTML=`<div class="card"><div class="resultCard">
    <h2>🏆 ${order[0].name} wins!</h2>${rows}
    <div class="credit">Model: "Deer Animation" by DarryleH · CC-BY-4.0 · sketchfab.com</div>
    <div style="margin-top:1.1rem"><button class="bigBtn" id="again" style="display:block">Race Again</button></div>
  </div></div>`;
  overlay.classList.remove('off');
  document.getElementById('again').addEventListener('click',()=>{
    // reset deer, re-configure, restart
    overlay.innerHTML=`<div class="card">
      <h1>The <span class="g">Reindeer</span> Dash</h1>
      <p class="sub">9 runners · 1 winner · pure chaos</p>
      <button class="bigBtn" id="startBtn2" style="display:block;margin:1.5rem auto 0">Race Again</button>
    </div>`;
    overlay.classList.remove('off');
    document.getElementById('startBtn2').addEventListener('click',beginRace);
  });
}

/* ── MAIN LOOP ───────────────────────────────────────── */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta());

  // Snow drift
  const sp=snowGeo.attributes.position;
  for(let i=0;i<sp.count;i++){let y=sp.getY(i)-11*dt;if(y<0)y=65;sp.setY(i,y);}
  sp.needsUpdate=true;

  if(racing) updateRace(dt);
  directCamera(dt);
  renderer.render(scene,camera);
}

init();
})();
</script>
