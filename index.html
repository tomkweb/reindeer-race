<style>

.bigBtn{font-family:'Luckiest Guy',cursive;cursor:pointer;border:none;color:#2a1209;

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
window.onerror=function(msg,src,line){
  document.body.innerHTML+='<div style="position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:12px;font-size:14px;z-index:999;word-break:break-all">ERROR line '+line+': '+msg+'</div>';
  return false;
};
(function(){
const VERSION='v8.17.0';
const NAMES=['Dasher','Dancer','Prancer','Vixen','Comet','Cupid','Donner','Blitzen','Rudolph'];
const COLORS=['#c47a3a','#b86d45','#d49050','#a05c2e','#c88048','#b07040','#d4a060','#985030','#e03020'];
// Racing silks — one distinct colour per reindeer (elf coat + saddle cloth + name tag + results)
const SILKS=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#ec407a','#f5f5f5'];
const ELF_COLORS=SILKS;
const N=9, LANE_W=1.6, BASE_SPEED=3.0;

// ── OVAL TRACK GEOMETRY ───────────────────────────────────────────────────────
// Layout: homestretch on right (X=+TR), backstretch on left (X=-TR)
// Reindeer run counterclockwise viewed from above (US racing standard).
// Visual scale kept small so deer are visible; race runs 1.25 laps = 1.25 miles
const STR  = 320;                       // straight length (m)
const TR   = 120;                       // turn radius (m)
const CIRC = 2*STR + 2*Math.PI*TR;     // full lap ≈ 1394m
const TW   = 14;                        // track width (m)

// Segment arc-length boundaries
const S1 = STR;
const S2 = STR + Math.PI*TR;
const S3 = 2*STR + Math.PI*TR;
const S4 = CIRC;

// Race layout — gate on homestretch, finish line 0.25 miles ahead (CCW)
// With reversed direction: homestretch traversed at p≈0.75–1.0
// Gate at top of homestretch = p=0.75; finish line at p=1.0 (≡ p=0)
const P_GATE   = 0.75;                  // spawn progress (top of homestretch)
const P_FINISH = P_GATE + 1.25;        // finish at cumulative p=2.0 (1.25 miles)

/**
 * Returns {x, z, ry} for a deer at fractional lap progress p (0..1)
 * with laneOff metres to the right of the centreline.
 */
function trackPos(p, laneOff){
  const u  = 1.0 - (((p % 1) + 1) % 1);  // reversed: progress runs 1→0 = counterclockwise
  const d  = u * CIRC;   // distance along track (m)
  let px, pz, tx, tz;    // centre-line position & unit tangent

  if(d < S1){
    // Homestretch: X = +TR, Z increases 0 → STR
    const t = d / STR;
    px = TR;  pz = t * STR;
    tx = 0;   tz = 1;

  } else if(d < S2){
    // Top turn: semicircle centred at (0, 0, STR), angle 0 → π
    const a = (d - S1) / (Math.PI * TR);   // 0..1
    const ang = a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = STR + Math.sin(ang) * TR;
    tx = -Math.sin(ang);   // tangent dx/d(ang) (normalised)
    tz =  Math.cos(ang);

  } else if(d < S3){
    // Backstretch: X = -TR, Z decreases STR → 0
    const t = (d - S2) / STR;
    px = -TR;  pz = STR - t * STR;
    tx = 0;    tz = -1;

  } else {
    // Bottom turn: semicircle centred at (0, 0, 0), angle π → 2π
    const a = (d - S3) / (Math.PI * TR);   // 0..1
    const ang = Math.PI + a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = Math.sin(ang) * TR;
    tx = -Math.sin(ang);
    tz =  Math.cos(ang);
  }

  // Right normal = (tz, 0, -tx)  →  positive laneOff moves outward
  return {
    x  : px + tz * laneOff,
    z  : pz - tx * laneOff,
    ry : Math.atan2(tx, tz) + Math.PI   // +π flips facing to match reversed travel direction
  };
}

// Rudolph nose offset (tune with calibration panel)
let noseOff = {x:0.00, y:-0.76, z:-0.02};
const TC_X = 0, TC_Z = STR / 2;

// ── ENGINE GLOBALS ────────────────────────────────────────────────────────────
let scene, camera, renderer, clock, hemiLight, sunLight;
let deerObjs=new Array(N).fill(null), deerLoaded=0, deerScale=1, autoScaleDone=false;
let racing=false, raceTime=0, finishCounter=0, finishedAll=false, postTimer=0;
let paused=false;
let speedMult=1;
// ── RACE ANNOUNCER (Web Speech API — no audio assets needed) ──
const ann={on:true, lastCall:0, lastLeadIdx:-1, calledLeadIdx:-1, leadSince:0, lastLeadT:-10, flags:{}, voice:null, cur:null, pending:null};
// A British male race caller — the classic Ascot/York sound. Voice names differ
// per platform, so walk a preference list: Chrome desktop, Edge/Windows natural
// voices, Apple, then Android Google TTS (gender isn't exposed there — rjs/gbd
// are the male en-GB variants). Falls back to any en-GB, then any English.
const GB_MALE=[/Google UK English Male/i, /Microsoft (Ryan|Thomas|Alfie|Elliot|Oliver|Ethan|Noah).*United Kingdom/i,
  /Microsoft George/i, /^(Daniel|Arthur|Oliver)\b/i, /en-gb-x-(rjs|gbd)/i];
function pickVoice(){
  try{
    if(!window.speechSynthesis) return;
    const vs=speechSynthesis.getVoices();
    if(!vs.length) return;
    const gb=vs.filter(v=>/en[-_]GB/i.test(v.lang));
    let best=null;
    const hit=re=>v=>re.test(v.name)||re.test(v.voiceURI||'');
    for(const re of GB_MALE){ best=gb.find(hit(re)) || vs.find(hit(re)); if(best) break; }
    ann.voice = best ||
      gb.find(v=>/male/i.test(v.name) && !/female/i.test(v.name)) ||
      gb.find(v=>/natural|neural|online|Google/i.test(v.name)) || gb[0] ||
      vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}
// Priority-aware speech so the call stays in sync with the race:
//   pri 1 colour/roll call — only if the caller is idle
//   pri 2 race event (lead change) — waits in the one-line queue behind the
//         current line (colour lines are short), dropped if stale when its turn comes
//   pri 3 landmark (turn for home, a furlong out…) — same queue, outranks pri 2
//   pri 4 (opts.force) — the break, the Grinch, the winner: cuts in immediately
// Queuing instead of cutting in keeps lines from being chopped mid-word.
// opts.valid() is re-checked when a queued line finally plays, and txt may be a
// function so a queued line describes the race as it is when it's spoken.
// Lines are kept short: a 4-name roll call took ~4s, and by the end of it the
// order it described had changed — the main source of "out of sync".
// Returns true if the line was spoken (or queued), false if dropped.
function say(txt, opts={}){
  if(!ann.on) return false;
  try{
    if(!window.speechSynthesis) return false;
    const pri = opts.force ? 4 : (opts.pri||1);
    const busy = speechSynthesis.speaking && ann.cur;
    if(busy){
      if(pri<=1) return false;
      if(pri<4){
        const q=ann.pending;
        if(q && q.pri>pri && performance.now()<q.until) return false;  // a bigger call is already waiting
        ann.pending={txt, opts, pri, until:performance.now()+(pri>=3?2500:1800)};
        return true;
      }
    }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(typeof txt==='function' ? txt() : txt);
    if(ann.voice){ u.voice=ann.voice; u.lang=ann.voice.lang; } else u.lang='en-GB';
    // High-energy caller: brisk (~3 words/s, like real callers, who don't
    // speed up much at the finish) and pitched up from the first call, climbing
    // toward a near-octave shout at the wire — excitement is carried by pitch.
    const r=opts.rate||1.15, p=opts.pitch||1.05;
    u.rate=1.15+Math.min(0.1,Math.max(0,(r-1.1)*0.3));
    u.pitch=Math.min(1.9, 1.15+Math.max(0,p-1)*2.0); u.volume=1;
    const me={pri}; ann.cur=me;
    u.onend=u.onerror=()=>{
      if(ann.cur!==me) return;
      ann.cur=null;
      const q=ann.pending; ann.pending=null;
      if(q && performance.now()<q.until && (!q.opts.valid || q.opts.valid())) say(q.txt, q.opts);
    };
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
// Where the field actually is, as a fraction of the race (leader's distance run).
// Gate sits 28m before the homestretch; the race is 1.25 laps, CCW, so the
// boundaries come from the real track geometry (S1..S3), not round numbers.
const GATE_D=(1-(P_GATE%1))*CIRC, RACE_M=1.25*CIRC;
const SEG={
  turn1: GATE_D/RACE_M,                 // past the post first time → first turn  (~0.20)
  back:  (GATE_D-S3+CIRC)/RACE_M,       // out of the first turn → backstretch   (~0.42)
  far:   (GATE_D-S2+CIRC)/RACE_M,       // backstretch → far turn                (~0.60)
  home:  (GATE_D-S1+CIRC)/RACE_M        // out of the far turn → homestretch     (~0.82)
};
const lengthsTxt=L=> L<0.3 ? pick(['a neck','a head']) : L<0.75 ? 'half a length'
  : L<1.25 ? 'a length' : L<1.75 ? 'a length and a half' : `${Math.round(L)} lengths`;
function announcerUpdate(){
  if(!racing) return;
  // Safety net: some Android TTS engines occasionally skip the 'end' event, which
  // would strand the queued line (and block colour calls) — flush it ourselves
  if(ann.pending && window.speechSynthesis && !speechSynthesis.speaking){
    const q=ann.pending; ann.pending=null; ann.cur=null;
    if(performance.now()<q.until && (!q.opts.valid || q.opts.valid())) say(q.txt, q.opts);
  }
  const ld=leader(); if(!ld) return;
  const frac=(ld.progress-P_GATE)/1.25;
  const F=ann.flags;
  const ord=topN(9);
  const gapL=(a,b)=>(a.progress-b.progress)*CIRC/2.5;   // a length ≈ 2.5m
  const li=deerObjs.indexOf(ld);
  // Any line that names the current leader counts as covering the lead;
  // only an explicit "takes the lead" call restarts the lead-call spacing
  const named=()=>{ ann.calledLeadIdx=li; };
  // Excitement escalates with the race — pitch climbs as they get closer to home
  const exR=1.02+frac*0.42, exP=1.0+frac*0.3;
  const L3={pri:3,rate:exR,pitch:exP};
  // ── landmark calls at the real track positions (each names the leader) ──
  if(!F.turn1 && frac>=SEG.turn1-0.02){ F.turn1=true;
    if(say(()=>{ const o=topN(2), ld=o[0]; return pick([`Past the post the first time, ${ld.name} leads them into the turn!`,
      `Into the first turn, and it's ${ld.name} showing the way!`]); },L3)) named(); }
  if(!F.back && frac>=SEG.back){ F.back=true;
    if(say(()=>{ const o=topN(2), ld=o[0]; return pick([`Down the backstretch, ${ld.name} in front!`,
      `They straighten up on the back side, ${ld.name} leads ${o[1].name}!`]); },L3)) named(); }
  if(!F.far && frac>=SEG.far){ F.far=true;
    if(say(()=>{ const o=topN(2), ld=o[0]; return pick([`Into the far turn, ${ld.name} leads, four furlongs to run!`,
      `Around the far turn they go, ${ld.name} still in front!`]); },L3)) named(); }
  if(!F.home && frac>=SEG.home){ F.home=true;
    if(say(()=>{ const o=topN(2), ld=o[0]; return pick([`They turn for home! ${o[0].name} from ${o[1].name}!`,
      `DOWN THE STRETCH THEY COME! ${o[0].name} and ${o[1].name}!`]); },{pri:3,rate:1.42,pitch:1.32})) named(); }
  if(!F.furlong && frac>=0.90){ F.furlong=true;
    if(say(()=>`A furlong to go, ${leader().name} in front!`,{pri:3,rate:1.3,pitch:1.3})) named(); }
  if(!F.final && frac>=0.95){ F.final=true;
    // Never call the winner early — the closer (or the Grinch) can still come
    if(say(()=>{ const o=topN(2), g=gapL(o[0],o[1]); return g<1.5 ? `${o[0].name}! ${o[1].name}! Nothing between them!`
      : `${o[0].name} ${lengthsTxt(g)} clear, ${o[1].name} chasing hard!`; },{pri:3,rate:1.45,pitch:1.38})) named(); }
  // ── the closer's run, called the moment it charges into the places ──
  if(!F.closer3 && dramaCloser && !dramaCloser.finished && frac>0.70){
    const cr=ord.indexOf(dramaCloser);
    if(cr>=1 && cr<=2){ F.closer3=true; crowdRoar('surge',0.7);
      say(pick([`Here comes ${dramaCloser.name}, FLYING on the outside!`,
        `${dramaCloser.name} has found another gear!`,
        `Out of nowhere, ${dramaCloser.name} is charging!`]),{pri:3,rate:1.42,pitch:1.32}); }
  }
  // ── lead changes. Until the turn for home the lead swaps constantly, so only
  // a change that STICKS (held 2.5s) gets its own call, at most every 12s —
  // the running roll calls name the leader in between anyway. From the turn
  // for home every change is called (held 0.6s, spaced 1.2s).
  const stretch=frac>SEG.home;
  if(li!==ann.lastLeadIdx){ ann.lastLeadIdx=li; ann.leadSince=raceTime; }
  const leadCallDue = li===ann.lastLeadIdx && li!==ann.calledLeadIdx && frac>0.04
    && raceTime-ann.leadSince>(stretch?0.6:2.5) && raceTime-ann.lastLeadT>(stretch?1.2:12);
  if(leadCallDue){
    if(ann.calledLeadIdx<0) named();   // first leader of the race — the break call covers it
    else { const was=deerObjs[ann.calledLeadIdx].name;
      if(say(pick([`${ld.name} takes the lead!`, `Now it's ${ld.name} in front!`,
      `${ld.name} goes past ${was}!`, `${ld.name} hits the front!`, `${was} is headed, ${ld.name} leads!`,
      `${ld.name} edges ahead of ${was}!`]),
      {pri:2,rate:exR,pitch:exP,valid:()=>leader()===ld})){ named(); ann.lastLeadT=raceTime; } }
  }
  // ── running colour: short roll calls, only when the caller is free ──
  // (held back only while a lead-change call is due, so it gets the floor first)
  if(frac>0.05 && frac<SEG.home && raceTime-ann.lastCall>3 && !leadCallDue){
    if(!(window.speechSynthesis && speechSynthesis.speaking) && !ann.pending){
      ann.lastCall=raceTime;
      const g=lengthsTxt(gapL(ord[0],ord[1]));
      if(say(pick([
        `${ord[0].name} by ${g}, ${ord[1].name} second, ${ord[2].name} third.`,
        `${ord[0].name} leads ${ord[1].name} by ${g}.`,
        `${ord[0].name} in front, ${ord[1].name} ${g} back.`,
        `${ord[0].name}, ${ord[1].name}, then ${ord[2].name}.`]),{pri:1,rate:exR,pitch:exP})) named();
    }
  }
  // ── the stretch run: urgent two-name calls whenever the caller is free ──
  if(frac>=SEG.home+0.015 && frac<0.985 && finishCounter===0 && raceTime-ann.lastCall>2
     && li===ann.calledLeadIdx && !(window.speechSynthesis && speechSynthesis.speaking) && !ann.pending){
    ann.lastCall=raceTime;
    const g=gapL(ord[0],ord[1]);
    say(g<1 ? pick([`${ord[0].name} and ${ord[1].name}, head to head!`,`${ord[1].name} won't go away!`])
      : pick([`${ord[0].name} digs in, ${ord[1].name} closing!`,`${ord[0].name} by ${lengthsTxt(g)}!`,`${ord[1].name} chasing, ${ord[2].name} on the outside!`]),
      {pri:1,rate:1.4,pitch:1.3});
  }
  // ── winner + placings ──
  if(!F.win && finishCounter>0){ F.win=true; crowdRoar('roar',0.8);
    const w=raceWinner();
    if(w===grinch) say(pick(['THE GRINCH STEALS THE RACE! UNBELIEVABLE!',
      'The Grinch WINS IT! You hate to see it, folks!']),{force:true,rate:1.28,pitch:1.22});
    else if(w) say(pick([`${w.name}! ${w.name} WINS IT!`,
      `${w.name} gets there! What! A! Finish!`,
      `At the wire, it's ${w.name}! Oh my goodness!`]),{force:true,rate:1.35,pitch:1.3});
  }
  if(!F.placed && finishCounter>=3){ F.placed=true;
    const p2=deerObjs.find(d=>d&&d.place===2)||( grinch&&grinch.place===2?grinch:null);
    const p3=deerObjs.find(d=>d&&d.place===3);
    if(p2&&p3) say(`${p2.name} takes second, ${p3.name} holds on for third!`,{pri:3,rate:1.15,pitch:1.1});
  }
}
// ── CROWD NOISE (Web Audio, recorded samples in audio/) ──
// Two looped beds — general ambience and excited chatter — crossfade with the
// race (murmur at the gate → building through the stretch), and one-shot roars
// fire at the big moments. Samples: Gregor Quendel, CC-BY-4.0 (credited on results),
// blended ~50/50 with CC0 Freesound recordings of women & mixed crowds cheering.
const crowd={ctx:null, out:null, shotBus:null, bed:null, excited:null, shots:{}, level:0, started:false, preT:0};
// Overall crowd volume. Kept well under the announcer: speechSynthesis can't be
// boosted past volume 1, so the crowd has to sit low for the calls to cut through.
const CROWD_VOL=0.35, CROWD_DUCK=0.4, SHOT_DUCK=0.8;  // roars barely duck — they ARE the moment
// Built during model loading so the Race tap never stalls. Silent until the
// first Race tap: browsers may auto-start a new AudioContext on sites you visit
// often, so suspend it explicitly and keep the master at 0 until crowd.started.
function crowdPrepare(){
  try{
    if(crowd.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); crowd.ctx=ctx;
    if(ctx.state==='running') ctx.suspend();
    crowd.out=ctx.createGain(); crowd.out.gain.value=0; crowd.out.connect(ctx.destination); // beds: mute + announcer duck
    crowd.shotBus=ctx.createGain(); crowd.shotBus.gain.value=0; crowd.shotBus.connect(ctx.destination); // one-shot roars
    crowd.bed=ctx.createGain(); crowd.excited=ctx.createGain();
    [crowd.bed, crowd.excited].forEach(g=>{ g.gain.value=0; g.connect(crowd.out); });
    // ?v= busts the 10-minute GitHub Pages cache so a new deploy can't play stale clips
    const load=n=>fetch('audio/crowd_'+n+'.mp3?v='+VERSION).then(r=>r.arrayBuffer())
      .then(b=>new Promise((ok,no)=>ctx.decodeAudioData(b,ok,no)));  // callback form for older Safari
    ['bed','excited'].forEach(n=>load(n).then(buf=>{
      const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      src.loopStart=0.05; src.loopEnd=buf.duration-0.05;   // skip MP3 encoder padding → no click at the seam
      src.connect(crowd[n]); src.start(0, 0.05+Math.random()*(buf.duration-0.2));
    }).catch(()=>{}));
    ['roar','cheer','surge'].forEach(n=>load(n).then(buf=>{ crowd.shots[n]=buf; }).catch(()=>{}));
  }catch(e){ crowd.ctx=null; }
}
function crowdInit(){   // must run inside a user gesture (Race button)
  try{
    crowdPrepare();
    crowd.started=true;
    if(crowd.ctx && crowd.ctx.state!=='running') crowd.ctx.resume();
  }catch(e){}
}
function crowdRoar(name, vol){
  const buf=crowd.shots[name];
  if(!crowd.ctx || !crowd.started || !buf || !ann.on) return;
  try{
    const src=crowd.ctx.createBufferSource(); src.buffer=buf;
    const g=crowd.ctx.createGain(); g.gain.value=vol;
    src.connect(g); g.connect(crowd.shotBus); src.start();
  }catch(e){}
}
function crowdUpdate(){
  if(!crowd.ctx) return;
  // Step on the audio clock, not the (capped) frame dt — a slow phone that
  // drops frames would otherwise make every swell lag behind the race
  const now=crowd.ctx.currentTime, dt=Math.min(0.5, now-(crowd.lastT??now)); crowd.lastT=now;
  let tgt;
  if(paused&&racing) tgt=0.03;
  else if(replayActive) tgt=0.45;
  else if(preRace){
    // Anticipation: soft as they load, swelling through the 3-2-1 countdown
    // (gate lineup PRE_RACE_DUR + ~3s count), peaking as the gates open
    crowd.preT+=dt;
    const k=Math.min(1, crowd.preT/(PRE_RACE_DUR+3));
    tgt=0.08+0.5*k*k;
  }
  else if(racing){
    const ld=leader();
    const frac=ld?Math.max(0,Math.min(1,(ld.progress-P_GATE)/1.25)):0;
    // Broadcast audio sits fairly level for most of the race and builds
    // ~6-8 dB from the final turn, peaking right at the line
    const b=Math.max(0,Math.min(1,(frac-0.62)/0.33));
    tgt = finishCounter>0 ? 0.6 : 0.28+0.47*b*b*(3-2*b);
    tgt = Math.max(tgt, 0.8-0.12*raceTime);   // gates-open roar carries ~4s, then settles
  } else tgt=0.12;   // results / title screen
  if(!preRace) crowd.preT=0;
  crowd.level += (tgt-crowd.level)*Math.min(1, dt*(tgt>crowd.level?2.0:0.6));
  const t=crowd.ctx.currentTime, L=crowd.level;
  crowd.bed.gain.setTargetAtTime(0.6*Math.min(1,L*3), t, 0.1);
  crowd.excited.gain.setTargetAtTime(0.7*Math.max(0,(L-0.2)/0.8), t, 0.1);
  // Master: mute with the 🔊 button; duck under the announcer so calls stay clear
  let m=(ann.on && crowd.started)?CROWD_VOL:0, ms=m;
  const noDuck = racing && raceTime<3.5;   // let the break roar over "And they're off!"
  try{ if(m && !noDuck && window.speechSynthesis && speechSynthesis.speaking){ m*=CROWD_DUCK; ms*=SHOT_DUCK; } }catch(e){}
  crowd.out.gain.setTargetAtTime(m, t, 0.25);
  crowd.shotBus.gain.setTargetAtTime(ms, t, 0.1);
}

    rect.position.set(0,0.02,STR/2);

// ── OVAL TRACK VISUAL ─────────────────────────────────────────────────────────
function buildOvalTrack(){
  fenceGroup = new THREE.Group();  // all posts + rails — hidden during photo-finish capture
  scene.add(fenceGroup);
  const railMat  = new THREE.MeshStandardMaterial({color:0x222222,roughness:.3});
  const postMat  = new THREE.MeshStandardMaterial({color:0xcc3344,roughness:.4,emissive:0x881122,emissiveIntensity:.5});
  const curbMat  = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.2,emissive:0xffffff,emissiveIntensity:.8});
  const bannerMat= new THREE.MeshStandardMaterial({color:0x155724});
  const hw = TW/2 + 1.5;
  const nCurb = 400; // high segment count — smooth curb strip visible from blimp
  const nPosts = 160;

  // CURB STRIPS — wide flat white bands at ground level, clearly visible overhead
  for(let i=0;i<nCurb;i++){
    const u0=i/nCurb, u1=(i+1)/nCurb;
    [-hw, hw].forEach(off=>{
      const a=trackPos(u0,off), b=trackPos(u1,off);
      const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
      const dx=b.x-a.x, dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz)+.04;
      const curb=new THREE.Mesh(new THREE.BoxGeometry(len,.15,3.0),curbMat);
      curb.position.set(mx,.06,mz);
      curb.rotation.y=-Math.atan2(dz,dx);
      scene.add(curb);
    });
  }

  // FENCE: candy cane posts (red/white stripes + hook) + two white rails
  const whiteMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,emissive:0xffffff,emissiveIntensity:.15});
  const redMat   = new THREE.MeshStandardMaterial({color:0xcc1122,roughness:.4,emissive:0x880000,emissiveIntensity:.3});
  const caneRailMat = new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.25,emissive:0xffffff,emissiveIntensity:.2});

  function makeCandyCane(height, radius){
    const g = new THREE.Group();
    const nStripes = 6;
    const stripeH = height / (nStripes * 2);
    for(let s=0; s<nStripes*2; s++){
      const mat = s%2===0 ? redMat : whiteMat;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, stripeH, 8), mat);
      seg.position.y = s * stripeH + stripeH/2;
      g.add(seg);
    }
    // Crook: half-torus in a vertical plane forming an upside-down J.
    // Torus centred at (hookR, height, 0); arc runs from staff top (0,height)
    // up and over to (2*hookR, height) — hook opens toward local +X.
    const hookR = radius*3;
    const hookGeo = new THREE.TorusGeometry(hookR, radius*0.85, 8, 14, Math.PI);
    const hook = new THREE.Mesh(hookGeo, redMat);
    hook.position.set(hookR, height, 0);  // vertical XY plane — no extra rotation needed
    g.add(hook);
    return g;
  }

  for(let i=0;i<nPosts;i++){
    const u0=i/nPosts, u1=(i+1)/nPosts;
    [-hw, hw].forEach(off=>{
      const a=trackPos(u0,off), b=trackPos(u1,off);
      const cane = makeCandyCane(2.8, 0.22);
      cane.position.set(a.x, 0, a.z);
      // Hook must face AWAY from the horses (away from track surface):
      // radial direction from track centreline outward through this post.
      const c0=trackPos(u0,0);
      let ax=a.x-c0.x, az=a.z-c0.z;
      const al=Math.sqrt(ax*ax+az*az)||1; ax/=al; az/=al;
      // rotation.y = t maps local +X to world (cos t, 0, -sin t)
      cane.rotation.y = Math.atan2(-az, ax);
      fenceGroup.add(cane);
      const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
      const dx=b.x-a.x, dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz)+.05;
      [0.9, 2.1].forEach(ry=>{
        const rail=new THREE.Mesh(new THREE.BoxGeometry(len,.22,.38),caneRailMat);
        rail.position.set(mx,ry,mz);
        rail.rotation.y=-Math.atan2(dz,dx);
        fenceGroup.add(rail);
      });
    });
  }

  // Finish line gantry at progress=0
  const fp=trackPos(0,0);
  const fi=trackPos(0,-hw-1), fo=trackPos(0,hw+1);
  // Outside gantry pole (plain)
  {
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,9,10),postMat);
    pole.position.set(fo.x,4.5,fo.z); scene.add(pole);
    finishPoles.push(pole);
  }
  // INFIELD: iconic white finish post with gold ball — like Churchill Downs
  {
    const whiteM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
    const goldM =new THREE.MeshStandardMaterial({color:0xd4af37,roughness:.25,metalness:.6});
    const post=new THREE.Group();
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.42,.55,8,12),whiteM);
    col.position.y=4; post.add(col);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.35,12),whiteM);
    cap.position.y=8.15; post.add(cap);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(.42,14,14),goldM);
    ball.position.y=8.85; post.add(ball);
    post.position.set(fi.x,0,fi.z);
    scene.add(post);
    finishPoles.push(post);
  }
  // FINISH banner — bold red with white text, canvas texture
  const bcv=document.createElement('canvas'); bcv.width=512; bcv.height=96;
  const bcx=bcv.getContext('2d');
  bcx.fillStyle='#c62828'; bcx.fillRect(0,0,512,96);
  bcx.fillStyle='#fff'; bcx.font='bold 64px sans-serif';
  bcx.textAlign='center'; bcx.textBaseline='middle';
  bcx.fillText('FINISH',256,50);
  const banTex=new THREE.CanvasTexture(bcv);
  const ban=new THREE.Mesh(new THREE.BoxGeometry(TW+4,2.2,.25),
    new THREE.MeshBasicMaterial({map:banTex}));
  ban.position.set(fp.x,8.5,fp.z);
  ban.rotation.y=fp.ry;
  scene.add(ban);
  finishLineGroup.push(ban);
  // Checkered finish strip across the track — high contrast, unmissable
  const ccv=document.createElement('canvas'); ccv.width=256; ccv.height=64;
  const ccx=ccv.getContext('2d');
  for(let cx=0;cx<8;cx++) for(let cy=0;cy<2;cy++){
    ccx.fillStyle=(cx+cy)%2?'#ffffff':'#111111';
    ccx.fillRect(cx*32,cy*32,32,32);
  }
  const chkTex=new THREE.CanvasTexture(ccv);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(TW+4,.06,2.2),
    new THREE.MeshBasicMaterial({map:chkTex}));
  stripe.rotation.y=fp.ry;
  stripe.position.set(fp.x,.04,fp.z);
  scene.add(stripe);
  finishLineGroup.push(stripe);
}

// ── GRANDSTAND + CHEERING CROWD ─────────────────────────────────────────────
// Stepped stand along the OUTSIDE of the homestretch (runners travel −z toward
// the finish at z=0, so the stand ends just past the line). ~1,700 spectators
// as 4 InstancedMeshes (body/head/arms/hats). All animation is in the vertex
// shader — bounce, arms up, waving — driven by two shared uniforms, so it costs
// no per-frame CPU on a phone. Excitement follows the crowd-noise level, so
// the stand erupts exactly when the audio does.
const STAND={x0:TR+TW/2+8, rows:12, rowD:1.7, rise:0.85, z0:6, z1:240};
const crowdU={uT:{value:0}, uEx:{value:0}};
// Height of the stand (incl. standing spectators) at a world x/z, 0 if outside.
// Cameras use it to sit ABOVE the crowd instead of shooting through it.
function standTopAt(x,z){
  const backX=STAND.x0+STAND.rows*STAND.rowD, wallTop=STAND.rows*STAND.rise+4.8;
  if(z<STAND.z0-2 || z>STAND.z1+2 || x<STAND.x0-1 || x>backX+1.5) return 0;
  if(x>backX-0.3 || z<STAND.z0+0.5 || z>STAND.z1-0.5) return wallTop;   // back wall + end walls
  const r=Math.floor((x-STAND.x0)/STAND.rowD);
  return Math.min(STAND.rows, Math.max(1,r+1))*STAND.rise + 2.2;
}
// Lift a camera position just enough that its line of sight to `at` clears
// the stand (a camera inside the stand rises above the spectators; one behind
// it, like the telephoto on the homestretch, looks over their heads)
function liftOverStand(from, at){
  let need=from.y;
  for(let i=0;i<=18;i++){
    const t=i/20;                              // stop short of the subject itself
    const h=standTopAt(from.x+(at.x-from.x)*t, from.z+(at.z-from.z)*t);
    if(h) need=Math.max(need, (h+(i?0.6:1.2) - at.y*t)/(1-t));
  }
  from.y=need;
}
function crowdMaterial(color, arms){
  const m=new THREE.MeshStandardMaterial({color, roughness:.8});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uT=crowdU.uT; sh.uniforms.uEx=crowdU.uEx;
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aPhase;\nuniform float uT;\nuniform float uEx;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        // bounce: everyone fidgets a little; the excited crowd jumps
        float rate = 5.0 + aPhase*3.0;
        float hop = max(0.0, sin(uT*rate + aPhase*40.0));
        transformed.y += hop*hop*(0.03 + 0.32*uEx);
        ${arms ? `
        // arms: a growing share of the crowd throws them up as excitement rises
        float up = clamp(uEx*1.9 - fract(aPhase*7.31), 0.0, 1.0);
        transformed.y += mix(-0.75, 0.0, up);
        transformed.z += sin(uT*(4.0+aPhase*2.0) + aPhase*25.0) * 0.12 * up * max(0.0, position.y);` : ''}`);
  };
  return m;
}
// Two arms in a V, merged into one non-indexed geometry
function armsGeometry(){
  const parts=[-1,1].map(s=>{
    const g=new THREE.BoxGeometry(.09,.6,.09).toNonIndexed();
    g.translate(0,.3,0); g.rotateX(s*0.45); g.translate(0,0,s*.2);
    return g;
  });
  const pos=[], nor=[];
  parts.forEach(g=>{ pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  return g;
}
function buildGrandstand(){

  const ban=new THREE.Mesh(new THREE.PlaneGeometry(len,3.2), new THREE.MeshBasicMaterial({map:tex}));
  ban.rotation.y=-Math.PI/2;                 // face the track (−x)

  [S.z0-.3, S.z1+.3].forEach(z=>{
    const end=new THREE.Mesh(new THREE.BoxGeometry(S.rows*S.rowD+.6, wallH, .6), concrete);

  });
  // Spectators
  const people=[];

      people.push({x:S.x0 + r*S.rowD + S.rowD*.42 + (Math.random()-.5)*.25,
                   y:(r+1)*S.rise, z:z+(Math.random()-.5)*.35, ph:Math.random()});

  const SHIRTS=[0xc62828,0x2e7d32,0xf5f5f5,0x1565c0,0xf9a825,0x6a1b9a,0xd84315,0x00838f];
  const SKIN=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac];
  const hatted=people.filter(()=>Math.random()<0.35);
  const parts=[
    {geo:new THREE.CylinderGeometry(.2,.27,.9,6,1,true), dy:.45, list:people, col:()=>pick(SHIRTS)},
    {geo:new THREE.IcosahedronGeometry(.17,0),           dy:1.06, list:people, col:()=>pick(SKIN)},
    {geo:armsGeometry(),                                  dy:1.0, list:people, col:()=>pick(SHIRTS), arms:true},
    {geo:new THREE.ConeGeometry(.18,.34,6),               dy:1.33, list:hatted, col:()=>0xc62828}
  ];
  const m4=new THREE.Matrix4(), col=new THREE.Color();
  parts.forEach(p=>{

    p.list.forEach((q,i)=>{

      mesh.setColorAt(i, col.setHex(p.col()));

    });
    geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph,1));
    mesh.instanceMatrix.needsUpdate=true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    mesh.frustumCulled=false;                // instances span 230m; base bounds don't
    scene.add(mesh);
  });
}
function updateStandCrowd(dt){
  crowdU.uT.value += dt;
  // Excitement tracks the crowd-noise level (0 until the first Race tap)
  const target=Math.min(1, Math.max(0.05, crowd.level*1.25));
  crowdU.uEx.value += (target-crowdU.uEx.value)*Math.min(1, dt*3);
}

// ── STARTING GATE ─────────────────────────────────────────────────────────────
let gateGroup=null, gateDoors=[], gateOpenAnim=0;
function buildStartingGate(){
  gateGroup=new THREE.Group();
  const gp=trackPos(P_GATE,0);
  const frameM=new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:.6});
  const doorM =new THREE.MeshStandardMaterial({color:0xc62828,roughness:.5});
  const W=N*LANE_W+1.2;   // gate width spanning all lanes
  const H=3.2;            // gate height
  // Top beam
  const beam=new THREE.Mesh(new THREE.BoxGeometry(W,0.35,0.5),frameM);
  beam.position.y=H; gateGroup.add(beam);
  // End posts + lane dividers
  for(let i=0;i<=N;i++){
    const px=-W/2+0.6+i*LANE_W;
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,H,8),frameM);
    post.position.set(px,H/2,0); gateGroup.add(post);
  }
  // Doors — one per lane, hinged at top, swing up when opened
  gateDoors=[];
  for(let i=0;i<N;i++){
    const px=-W/2+0.6+i*LANE_W+LANE_W/2;
    const hinge=new THREE.Group();
    hinge.position.set(px,H-0.4,0);
    const door=new THREE.Mesh(new THREE.BoxGeometry(LANE_W-0.25,H-1.0,0.08),doorM);
    door.position.y=-(H-1.0)/2;
    hinge.add(door);
    gateGroup.add(hinge);
    gateDoors.push(hinge);
  }
  // Position and orient at the gate location, facing direction of travel
  gateGroup.position.set(gp.x,0,gp.z);
  gateGroup.rotation.y=gp.ry;
  scene.add(gateGroup);
}
function updateGateDoors(dt){
  if(gateOpenAnim<=0) return;
  gateOpenAnim=Math.max(0,gateOpenAnim-dt);
  const t=1-(gateOpenAnim/0.4); // 0→1 over 0.4s
  const ang=t*Math.PI*0.55;     // swing up ~100°
  gateDoors.forEach(h=>h.rotation.x=ang);
}

// ── SNOW ──────────────────────────────────────────────────────────────────────
// ── CHRISTMAS INFIELD + FALLING SNOW ──────────────────────────
let snowPts=null;
const SNOW_N=420, SNOW_BOX={x:240, y:110, z:240};
const snowFlakes=[];
function buildSnow(){
  const ri=TR-TW/2-6;   // stay well inside the inner rail
  // Helper — random point on the infield stadium shape (rect + two turn circles)
  function infieldSpot(){
    const r=Math.random();
    if(r<0.6){ return {x:(Math.random()*2-1)*(ri-6), z:8+Math.random()*(STR-16)}; }
    const ang=Math.random()*Math.PI*2, rad=Math.random()*(ri-8);
    const cz=(r<0.8)?0:STR;
    return {x:Math.cos(ang)*rad, z:cz+Math.sin(ang)*rad};
  }
  const trunkM=new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.9});
  const pineM =new THREE.MeshStandardMaterial({color:0x1d5c2a,roughness:.85});
  const pineM2=new THREE.MeshStandardMaterial({color:0x2a7a38,roughness:.85});
  const snowM =new THREE.MeshStandardMaterial({color:0xf4f8ff,roughness:.6});
  // ── Christmas trees ──
  for(let i=0;i<16;i++){
    const s=infieldSpot();
    const h=7+Math.random()*7;          // 7–14m tall
    const t=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(h*.05,h*.07,h*.22,8),trunkM);
    trunk.position.y=h*.11; t.add(trunk);
    const pm=(i%2)?pineM:pineM2;
    // three stacked cones
    [[.5,.20,.42],[.38,.42,.34],[.27,.62,.30]].forEach(c=>{
      const cone=new THREE.Mesh(new THREE.ConeGeometry(h*c[0],h*c[2],9),pm);
      cone.position.y=h*c[1]+h*c[2]/2; t.add(cone);
    });
    // snowy tip
    const tip=new THREE.Mesh(new THREE.ConeGeometry(h*.14,h*.14,9),snowM);
    tip.position.y=h*.88; t.add(tip);
    // snow ring at the base
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(h*.42,h*.42,0.05,12),snowM);
    ring.position.y=0.045; t.add(ring);
    t.position.set(s.x,0.02,s.z);
    t.rotation.y=Math.random()*Math.PI*2;
    scene.add(t);
  }
  // ── snow patches on the grass ──
  for(let i=0;i<12;i++){
    const s=infieldSpot();
    const rad=5+Math.random()*13;
    const patch=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,0.04,18),snowM);
    patch.scale.x=0.6+Math.random()*0.8;   // squash into irregular ovals
    patch.rotation.y=Math.random()*Math.PI;
    patch.position.set(s.x,0.045,s.z);
    scene.add(patch);
  }
  // ── falling snow ── soft round flakes in a camera-following volume
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(SNOW_N*3);
  for(let i=0;i<SNOW_N;i++){
    const f={
      x:(Math.random()-0.5)*SNOW_BOX.x,
      y:Math.random()*SNOW_BOX.y,
      z:(Math.random()-0.5)*SNOW_BOX.z,
      vy:-(1.6+Math.random()*2.6),
      ph:Math.random()*Math.PI*2,
      sw:0.4+Math.random()*1.0
    };
    snowFlakes.push(f);
    pos[i*3]=f.x; pos[i*3+1]=f.y; pos[i*3+2]=f.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const cv=document.createElement('canvas'); cv.width=cv.height=32;
  const c2=cv.getContext('2d');
  const grad=c2.createRadialGradient(16,16,0,16,16,16);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.5,'rgba(255,255,255,.85)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  c2.fillStyle=grad; c2.fillRect(0,0,32,32);
  const mat=new THREE.PointsMaterial({size:0.9,map:new THREE.CanvasTexture(cv),
    color:0xffffff,transparent:true,opacity:.9,depthWrite:false,sizeAttenuation:true});
  snowPts=new THREE.Points(geo,mat);
  snowPts.frustumCulled=false;
  snowPts.visible=false;
  scene.add(snowPts);
}
let snowTime=0;
function updateSnow(dt){
  if(!snowPts) return;
  const show = preRace || racing || replayActive || winnerCamActive;
  snowPts.visible=show;
  if(!show) return;
  snowTime+=dt;
  const pos=snowPts.geometry.attributes.position.array;
  const cx=camera.position.x, cz=camera.position.z;
  for(let i=0;i<SNOW_N;i++){
    const f=snowFlakes[i];
    f.y+=f.vy*dt;
    f.x+=Math.sin(snowTime*f.sw+f.ph)*0.6*dt;
    if(f.y<0) f.y+=SNOW_BOX.y;
    // wrap the volume around the camera so snow is everywhere the camera looks
    let wx=f.x-cx, wz=f.z-cz;
    wx=((wx%SNOW_BOX.x)+SNOW_BOX.x*1.5)%SNOW_BOX.x - SNOW_BOX.x/2;
    wz=((wz%SNOW_BOX.z)+SNOW_BOX.z*1.5)%SNOW_BOX.z - SNOW_BOX.z/2;
    pos[i*3]=cx+wx; pos[i*3+1]=f.y; pos[i*3+2]=cz+wz;
  }
  snowPts.geometry.attributes.position.needsUpdate=true;
}

// ── LOAD DEER ─────────────────────────────────────────────────────────────────
function normalizeClip(clip){
  let minT=Infinity;
  clip.tracks.forEach(tr=>{if(tr.times.length) minT=Math.min(minT,tr.times[0]);});
  if(minT>0) clip.tracks.forEach(tr=>{for(let i=0;i<tr.times.length;i++) tr.times[i]-=minT;});
  clip.resetDuration();
  return clip;
}
function loadAllDeer(){
  if(!THREE.GLTFLoader){
    loadMsg.textContent='ERROR: 3D loader not available.';
    loadMsg.style.color='#ff8888'; return;
  }
  const loader=new THREE.GLTFLoader();
  setTimeout(()=>{if(deerLoaded===0){
    loadMsg.textContent='Network error — try refreshing.';
    loadMsg.style.color='#ff8888';
  }},20000);
  // Load 9 times with unique query strings to bypass Three.js request deduplication
  for(let i=0;i<N;i++){
    (function(idx){
      loader.load(
        'https://raw.githubusercontent.com/tomkweb/reindeer-race/main/scene.gltf?n='+idx,
        gltf=>setupDeer(gltf.scene,
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'Rundeer')),
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'IdleDeer')),
          idx),
        null,
        err=>{loadMsg.textContent='Load failed ('+idx+'): '+(err.message||err);loadMsg.style.color='#ff8888';}
      );
    })(i);
  }
}
function setupDeer(deerScene, runClip, idleClip, idx){
  deerScene.scale.setScalar(deerScale);

  // Colour tint
  const tint=new THREE.Color(COLORS[idx]);
  deerScene.traverse(n=>{
    if(!n.isMesh) return;
    const orig=Array.isArray(n.material)?n.material[0]:n.material;
    const mat=orig.clone();
    if(mat.color.r+mat.color.g+mat.color.b>0.25) mat.color.multiply(tint);
    mat.roughness=0.75; mat.metalness=0.0;
    n.material=mat; n.castShadow=true; n.receiveShadow=true;
  });

  // Rudolph's nose
  let headNode=null, noseGroup=null;
  if(idx===8){
    const nm=new THREE.MeshStandardMaterial(
      {color:0xff2233,emissive:0xff1122,emissiveIntensity:2.5,roughness:.2});
    noseGroup=new THREE.Group();
    noseGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.14,14,14),nm));
    scene.add(noseGroup);
    deerScene.traverse(nd=>{
      if(!headNode&&nd.name&&nd.name.toLowerCase().includes('head')
         &&!nd.name.toLowerCase().includes('tip')) headNode=nd;
    });
  }

  // Spine bone for elf seat
  let backBone=null;
  deerScene.traverse(nd=>{
    if(!backBone&&nd.name&&/back_0\d+$/i.test(nd.name)) backBone=nd;
  });

  // Elf
  const elf=makeElf(ELF_COLORS[idx]);
  // Saddle cloth in silk colour under the elf
  const cloth=new THREE.Mesh(
    new THREE.BoxGeometry(.55,.06,.85),
    new THREE.MeshStandardMaterial({color:SILKS[idx],roughness:.8}));
  cloth.position.y=-.24;
  elf.add(cloth);
  // Floating name tag — canvas sprite, always faces camera
  const tag=makeTag(NAMES[idx], SILKS[idx], (idx===3||idx===8)?'#222':'#fff'); // dark text on yellow/white
  elf.scale.setScalar(2.2);
  scene.add(elf);

  // Animation mixer per deer (clips are shared, mixers are per-instance)
  const mixer  =new THREE.AnimationMixer(deerScene);
  const action =mixer.clipAction(runClip);
  const idleAct=mixer.clipAction(idleClip);
  action.setLoop(THREE.LoopRepeat,Infinity);
  action.play(); action.paused=true;
  idleAct.play(); idleAct.paused=true;

  const laneOff=(idx-(N-1)/2)*LANE_W;
  const sp=trackPos(P_GATE,laneOff);
  deerScene.position.set(sp.x,0,sp.z);
  deerScene.rotation.y=sp.ry;
  scene.add(deerScene);

  deerObjs[idx]={
    group:deerScene, mixer, action, idleAct,
    noseGroup, headNode, elf, backBone, tag,
    laneOff, curLane:laneOff, progress:P_GATE, speed:0,
    base:0, surgeF:0, surgeP:0, amp:0,
    flightProg:-1, flightDur:0, flightAlt:0, nextFlight:0,
    place:0, finished:false, name:NAMES[idx]
  };

  deerLoaded++;
  loadBar.style.width=(deerLoaded/N*100)+'%';
  loadMsg.textContent='Cloning deer… '+deerLoaded+'/9';
  if(deerLoaded===N){ loadMsg.textContent='Ready!'; startBtn.style.display='block'; document.getElementById('introBtn').style.display='block'; }
}


// ── RACE SETUP ────────────────────────────────────────────────────────────────
function configureRace(){
  raceTime=0; finishCounter=0; finishedAll=false; postTimer=0;
  paused=false; if(typeof pauseBtn!=='undefined') pauseBtn.textContent='⏸';
  winnerCamActive=false; winnerCamTimer=0; preRace=false;
  gateOpenAnim=0; gateDoors.forEach(h=>h.rotation.x=0); // close doors
  photoFinish=[]; photoQueue=[];
  finishLineHidden=false;
  finishLineGroup.forEach(o=>o.visible=true);
  finishPoles.forEach(o=>o.visible=true);
  if(gateGroup && !gateGroup.parent) scene.add(gateGroup); // restore gate if removed mid-race
  deerObjs.forEach(d=>{
    if(!d) return;
    d.progress=P_GATE; d.place=0; d.finished=false;
    d.curLane=d.laneOff;  // live lane that merges inward during the race
    d.stretchLane=null;   // set when a closer swings wide in the stretch
    d.flightProg=-1; d.nextFlight=2.5+Math.random()*4;
    d.base   = 13.6 + Math.random()*0.8; // tight spread — nobody runs away with it
    d.isCloser = false;                // drama closer — assigned below
    d.surgeF = 0.10 + Math.random()*0.14; // long, slow surges — leaders hold real stints
    d.surgeP = Math.random()*Math.PI*2;
    d.amp    = 0.08 + Math.random()*0.07;  // ~12 lead changes a race
    d.speed  = d.base;
    const sp=trackPos(P_GATE, d.laneOff);
    d.group.position.set(sp.x, 0, sp.z);
    d.group.rotation.y=sp.ry;
    d.idleAct.stop();
    d.action.reset().play(); d.action.paused=false;
    d.mixer.setTime(Math.random()*2);
  });
  // COME-FROM-BEHIND DRAMA — one random deer per race is the designated closer:
  // slightly handicapped early so it sits mid-pack or worse, then unleashes a
  // monster kick through the final stretch. The wire cam tracks the charge.
  dramaCloser = deerObjs[Math.floor(Math.random()*N)] || null;
  if(dramaCloser){
    dramaCloser.isCloser = true;
    dramaCloser.base *= 0.965;  // runs off the pace — rubber-band keeps it in touch
    dramaCloser.amp = Math.min(dramaCloser.amp, 0.20); // steady, saving ground
    dramaCloserWins = Math.random() < 0.80;  // 1-in-5: the rally falls a nose short
  }
  // THE GRINCH — every third race he drops in from above and steals it
  raceCount++;
  grinchRace = (raceCount % 3 === 0);
  if(grinch){
    grinch.group.visible=false; grinch.tag.visible=false;
    grinch.finished=false; grinch.place=0; grinch.progress=0;
    grinch.dropping=false; grinch.landed=false; grinch.speed=0; grinch.dropY=0;
  }

}
function beginRace(){
  crowdInit();

  // Scene-setter during the gate lineup — also wakes the speech engine, whose
  // first utterance lags (esp. Android), so "And they're off!" lands on the break
  ann.cur=null; ann.pending=null;
  say(pick(["They're in the gate for the Reindeer Dash!","Nine reindeer, one prize. They're loading up!"]),{force:true,rate:1.15,pitch:1.1});
  overlay.classList.add('off');
  camBar.style.display='flex';
  preRace=true; preRaceTimer=0;
  // Deer idle at gate while camera shows them lined up
  deerObjs.forEach(d=>{ if(!d) return;
    d.action.paused=true; d.idleAct.reset().play();
  });
  // After PRE_RACE_DUR, show countdown then open gates
  setTimeout(()=>{
    showCountdown(()=>{ preRace=false; racing=true;
      ann.flags={}; ann.lastCall=0; ann.lastLeadIdx=-1; ann.calledLeadIdx=-1; ann.lastLeadT=-10; ann.pending=null;
      say("And they're off!",{force:true,rate:1.25,pitch:1.15});
      crowdRoar('cheer',0.9); crowd.level=Math.max(crowd.level,0.8);  // gates open: instant surge
      gateOpenAnim=0.4; // doors fly open

      finishLineGroup.forEach(o=>o.visible=false);
      finishPoles.forEach(o=>o.visible=false);
      finishLineHidden=true;
      deerObjs.forEach(d=>{ if(!d) return;
        d.idleAct.stop(); d.action.reset().play(); d.action.paused=false;

}
function showCountdown(done){
