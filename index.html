// ── STARTING GATE ─────────────────────────────────────────────────────────────
let gateGroup=null, gateDoors=[], gateOpenAnim=0;
function buildStartingGate(){
  gateGroup=new THREE.Group();
  const gp=trackPos(P_GATE,0);
  const frameM=new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:.6});
  const doorM =new THREE.MeshStandardMaterial({color:0xc62828,roughness:.5});
  const W=N*LANE_W+1.2;   // gate width spanning all lanes
  const H=3.2;            // gate height
  // Top beam
  const beam=new THREE.Mesh(new THREE.BoxGeometry(W,0.35,0.5),frameM);
  beam.position.y=H; gateGroup.add(beam);
  // End posts + lane dividers
  for(let i=0;i<=N;i++){
    const px=-W/2+0.6+i*LANE_W;
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,H,8),frameM);
    post.position.set(px,H/2,0); gateGroup.add(post);
  }
  // Doors — one per lane, hinged at top, swing up when opened
  gateDoors=[];
  for(let i=0;i<N;i++){
    const px=-W/2+0.6+i*LANE_W+LANE_W/2;
    const hinge=new THREE.Group();
    hinge.position.set(px,H-0.4,0);
    const door=new THREE.Mesh(new THREE.BoxGeometry(LANE_W-0.25,H-1.0,0.08),doorM);
    door.position.y=-(H-1.0)/2;
    hinge.add(door);
    gateGroup.add(hinge);
    gateDoors.push(hinge);
  }
  // Position and orient at the gate location, facing direction of travel
  gateGroup.position.set(gp.x,0,gp.z);
  gateGroup.rotation.y=gp.ry;
  scene.add(gateGroup);
}
function updateGateDoors(dt){
  if(gateOpenAnim<=0) return;
  gateOpenAnim=Math.max(0,gateOpenAnim-dt);
  const t=1-(gateOpenAnim/0.4); // 0→1 over 0.4s
  const ang=t*Math.PI*0.55;     // swing up ~100°
  gateDoors.forEach(h=>h.rotation.x=ang);
}

// ── SNOW ──────────────────────────────────────────────────────────────────────
// ── CHRISTMAS INFIELD + FALLING SNOW ──────────────────────────
let snowPts=null;
const SNOW_N=420, SNOW_BOX={x:240, y:110, z:240};
const snowFlakes=[];
function buildSnow(){
  const ri=TR-TW/2-6;   // stay well inside the inner rail
  // Helper — random point on the infield stadium shape (rect + two turn circles)
  function infieldSpot(){
    const r=Math.random();
    if(r<0.6){ return {x:(Math.random()*2-1)*(ri-6), z:8+Math.random()*(STR-16)}; }
    const ang=Math.random()*Math.PI*2, rad=Math.random()*(ri-8);
    const cz=(r<0.8)?0:STR;
    return {x:Math.cos(ang)*rad, z:cz+Math.sin(ang)*rad};
  }
  const trunkM=new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.9});
  const pineM =new THREE.MeshStandardMaterial({color:0x1d5c2a,roughness:.85});
  const pineM2=new THREE.MeshStandardMaterial({color:0x2a7a38,roughness:.85});
  const snowM =new THREE.MeshStandardMaterial({color:0xf4f8ff,roughness:.6});
  // ── Christmas trees ──
  for(let i=0;i<16;i++){
    const s=infieldSpot();
    const h=7+Math.random()*7;          // 7–14m tall
    const t=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(h*.05,h*.07,h*.22,8),trunkM);
    trunk.position.y=h*.11; t.add(trunk);
    const pm=(i%2)?pineM:pineM2;
    // three stacked cones
    [[.5,.20,.42],[.38,.42,.34],[.27,.62,.30]].forEach(c=>{
      const cone=new THREE.Mesh(new THREE.ConeGeometry(h*c[0],h*c[2],9),pm);
      cone.position.y=h*c[1]+h*c[2]/2; t.add(cone);
    });
    // snowy tip
    const tip=new THREE.Mesh(new THREE.ConeGeometry(h*.14,h*.14,9),snowM);
    tip.position.y=h*.88; t.add(tip);
    // snow ring at the base
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(h*.42,h*.42,0.05,12),snowM);
    ring.position.y=0.045; t.add(ring);
    t.position.set(s.x,0.02,s.z);
    t.rotation.y=Math.random()*Math.PI*2;
    scene.add(t);
  }
  // ── snow patches on the grass ──
  for(let i=0;i<12;i++){
    const s=infieldSpot();
    const rad=5+Math.random()*13;
    const patch=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,0.04,18),snowM);
    patch.scale.x=0.6+Math.random()*0.8;   // squash into irregular ovals
    patch.rotation.y=Math.random()*Math.PI;
    patch.position.set(s.x,0.045,s.z);
    scene.add(patch);
  }
  // ── falling snow ── soft round flakes in a camera-following volume
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(SNOW_N*3);
  for(let i=0;i<SNOW_N;i++){
    const f={
      x:(Math.random()-0.5)*SNOW_BOX.x,
      y:Math.random()*SNOW_BOX.y,
      z:(Math.random()-0.5)*SNOW_BOX.z,
      vy:-(1.6+Math.random()*2.6),
      ph:Math.random()*Math.PI*2,
      sw:0.4+Math.random()*1.0
    };
    snowFlakes.push(f);
    pos[i*3]=f.x; pos[i*3+1]=f.y; pos[i*3+2]=f.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const cv=document.createElement('canvas'); cv.width=cv.height=32;
  const c2=cv.getContext('2d');
  const grad=c2.createRadialGradient(16,16,0,16,16,16);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.5,'rgba(255,255,255,.85)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  c2.fillStyle=grad; c2.fillRect(0,0,32,32);
  const mat=new THREE.PointsMaterial({size:0.9,map:new THREE.CanvasTexture(cv),
    color:0xffffff,transparent:true,opacity:.9,depthWrite:false,sizeAttenuation:true});
  snowPts=new THREE.Points(geo,mat);
  snowPts.frustumCulled=false;
  snowPts.visible=false;
  scene.add(snowPts);
}
let snowTime=0;
function updateSnow(dt){
  if(!snowPts) return;
  const show = preRace || racing || replayActive || winnerCamActive;
  snowPts.visible=show;
  if(!show) return;
  snowTime+=dt;
  const pos=snowPts.geometry.attributes.position.array;
  const cx=camera.position.x, cz=camera.position.z;
  for(let i=0;i<SNOW_N;i++){
    const f=snowFlakes[i];
    f.y+=f.vy*dt;
    f.x+=Math.sin(snowTime*f.sw+f.ph)*0.6*dt;
    if(f.y<0) f.y+=SNOW_BOX.y;
    // wrap the volume around the camera so snow is everywhere the camera looks
    let wx=f.x-cx, wz=f.z-cz;
    wx=((wx%SNOW_BOX.x)+SNOW_BOX.x*1.5)%SNOW_BOX.x - SNOW_BOX.x/2;
    wz=((wz%SNOW_BOX.z)+SNOW_BOX.z*1.5)%SNOW_BOX.z - SNOW_BOX.z/2;
    pos[i*3]=cx+wx; pos[i*3+1]=f.y; pos[i*3+2]=cz+wz;
  }
  snowPts.geometry.attributes.position.needsUpdate=true;
}

// ── ELF JOCKEY ────────────────────────────────────────────────────────────────
function makeElf(coatColor){
  const g = new THREE.Group();
  const skin =new THREE.MeshStandardMaterial({color:0xf3c894,roughness:.7});
  const coat =new THREE.MeshStandardMaterial({color:coatColor,roughness:.7});
  const pants=new THREE.MeshStandardMaterial({color:0x2a4d3a,roughness:.7});
  const boot =new THREE.MeshStandardMaterial({color:0x2a1a0a,roughness:.8});
  const gold =new THREE.MeshStandardMaterial({color:0xd9a233,roughness:.4,metalness:.4});
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6});
  const dark =new THREE.MeshStandardMaterial({color:0x111111});
  // Torso + belt
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.16,.20,.4,10),coat);
  body.castShadow=true; g.add(body);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,12),boot);
  belt.position.y=-.18; g.add(belt);
  const buckle=new THREE.Mesh(new THREE.BoxGeometry(.07,.05,.01),gold);
  buckle.position.set(0,-.18,.18); g.add(buckle);
  // Head + face
  const head=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),skin);
  head.position.y=.32; head.castShadow=true; g.add(head);
  [-0.045,0.045].forEach(x=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(.018,6,6),dark);
    e.position.set(x,.34,.115); g.add(e);
  });
  const noseMesh=new THREE.Mesh(new THREE.SphereGeometry(.022,6,6),skin);
  noseMesh.position.set(0,.31,.125);
  g.add(noseMesh);
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.035,.12,5),skin);
    ear.position.set(s*.13,.34,-.01); ear.rotation.z=s*Math.PI/2.2; g.add(ear);
  });
  // Hat
  const hat=new THREE.Mesh(new THREE.ConeGeometry(.15,.4,12),coat);
  hat.position.y=.65; hat.rotation.x=-.18; hat.castShadow=true; g.add(hat);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.05,12),white);
  band.position.y=.47; g.add(band);
  const pom=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),white);
  pom.position.set(.06,.86,.06); g.add(pom);
  // Arms
  [-1,1].forEach(s=>{
    const pv=new THREE.Group();
    pv.position.set(s*.18,.05,0);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.32,6),coat);
    arm.position.y=-.16; arm.castShadow=true; pv.add(arm);
    pv.rotation.x=-.95; g.add(pv);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),skin);
    hand.position.set(s*.16,-.05,.28); g.add(hand);
  });
  // Legs
  [-1,1].forEach(s=>{
    const lp=new THREE.Group();
    lp.position.set(s*.12,-.22,0);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.055,.05,.35,7),pants);
    leg.position.y=-.175; leg.castShadow=true; lp.add(leg);
    lp.rotation.z=s*.45; g.add(lp);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.06,.14),boot);
    b.position.set(s*.30,-.55,.02); g.add(b);
  });
  return g;
}

// ── LOAD DEER ─────────────────────────────────────────────────────────────────
function normalizeClip(clip){
  let minT=Infinity;
  clip.tracks.forEach(tr=>{if(tr.times.length) minT=Math.min(minT,tr.times[0]);});
  if(minT>0) clip.tracks.forEach(tr=>{for(let i=0;i<tr.times.length;i++) tr.times[i]-=minT;});
  clip.resetDuration();
  return clip;
}
function loadAllDeer(){
  if(!THREE.GLTFLoader){
    loadMsg.textContent='ERROR: 3D loader not available.';
    loadMsg.style.color='#ff8888'; return;
  }
  const loader=new THREE.GLTFLoader();
  setTimeout(()=>{if(deerLoaded===0){
    loadMsg.textContent='Network error — try refreshing.';
    loadMsg.style.color='#ff8888';
  }},20000);
  // Load 9 times with unique query strings to bypass Three.js request deduplication
  for(let i=0;i<N;i++){
    (function(idx){
      loader.load(
        'https://raw.githubusercontent.com/tomkweb/reindeer-race/main/scene.gltf?n='+idx,
        gltf=>setupDeer(gltf.scene,
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'Rundeer')),
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'IdleDeer')),
          idx),
        null,
        err=>{loadMsg.textContent='Load failed ('+idx+'): '+(err.message||err);loadMsg.style.color='#ff8888';}
      );
    })(i);
  }
}
function setupDeer(deerScene, runClip, idleClip, idx){
  deerScene.scale.setScalar(deerScale);

  // Colour tint
  const tint=new THREE.Color(COLORS[idx]);
  deerScene.traverse(n=>{
    if(!n.isMesh) return;
    const orig=Array.isArray(n.material)?n.material[0]:n.material;
    const mat=orig.clone();
    if(mat.color.r+mat.color.g+mat.color.b>0.25) mat.color.multiply(tint);
    mat.roughness=0.75; mat.metalness=0.0;
    n.material=mat; n.castShadow=true; n.receiveShadow=true;
  });

  // Rudolph's nose
  let headNode=null, noseGroup=null;
  if(idx===8){
    const nm=new THREE.MeshStandardMaterial(
      {color:0xff2233,emissive:0xff1122,emissiveIntensity:2.5,roughness:.2});
    noseGroup=new THREE.Group();
    noseGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.14,14,14),nm));
    scene.add(noseGroup);
    deerScene.traverse(nd=>{
      if(!headNode&&nd.name&&nd.name.toLowerCase().includes('head')
         &&!nd.name.toLowerCase().includes('tip')) headNode=nd;
    });
  }

  // Spine bone for elf seat
  let backBone=null;
  deerScene.traverse(nd=>{
    if(!backBone&&nd.name&&/back_0\d+$/i.test(nd.name)) backBone=nd;
  });

  // Elf
  const elf=makeElf(ELF_COLORS[idx]);
  // Saddle cloth in silk colour under the elf
  const cloth=new THREE.Mesh(
    new THREE.BoxGeometry(.55,.06,.85),
    new THREE.MeshStandardMaterial({color:SILKS[idx],roughness:.8}));
  cloth.position.y=-.24;
  elf.add(cloth);
  // Floating name tag — canvas sprite, always faces camera
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const cx2=cv.getContext('2d');
  cx2.fillStyle=SILKS[idx];
  cx2.beginPath(); cx2.roundRect(6,8,500,112,48); cx2.fill();
  cx2.fillStyle=(idx===3||idx===8)?'#222':'#fff'; // dark text on yellow/white
  cx2.font='bold 72px sans-serif'; cx2.textAlign='center'; cx2.textBaseline='middle';
  cx2.fillText(NAMES[idx],256,66);
  const tagTex=new THREE.CanvasTexture(cv);
  const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:tagTex,depthTest:false,transparent:true,opacity:.95}));
  tag.scale.set(5.2,1.3,1);
  scene.add(tag); // world space — tracked per frame
  elf.scale.setScalar(2.2);
  scene.add(elf);

  // Animation mixer per deer (clips are shared, mixers are per-instance)
  const mixer  =new THREE.AnimationMixer(deerScene);
  const action =mixer.clipAction(runClip);
  const idleAct=mixer.clipAction(idleClip);
  action.setLoop(THREE.LoopRepeat,Infinity);
  action.play(); action.paused=true;
  idleAct.play(); idleAct.paused=true;

  const laneOff=(idx-(N-1)/2)*LANE_W;
  const sp=trackPos(P_GATE,laneOff);
  deerScene.position.set(sp.x,0,sp.z);
  deerScene.rotation.y=sp.ry;
  scene.add(deerScene);

  deerObjs[idx]={
    group:deerScene, mixer, action, idleAct,
    noseGroup, headNode, elf, backBone, tag,
    laneOff, curLane:laneOff, progress:P_GATE, speed:0,
    base:0, surgeF:0, surgeP:0, amp:0,
    flightProg:-1, flightDur:0, flightAlt:0, nextFlight:0,
    place:0, finished:false, name:NAMES[idx]
  };

  deerLoaded++;
  loadBar.style.width=(deerLoaded/N*100)+'%';
  loadMsg.textContent='Cloning deer… '+deerLoaded+'/9';
  if(deerLoaded===N){ loadMsg.textContent='Ready!'; startBtn.style.display='block'; document.getElementById('calBtn').style.display='block'; }
}


// ── RACE SETUP ────────────────────────────────────────────────────────────────
function configureRace(){
  raceTime=0; finishCounter=0; finishedAll=false; postTimer=0;
  paused=false; if(typeof pauseBtn!=='undefined') pauseBtn.textContent='⏸';
  winnerCamActive=false; winnerCamTimer=0; preRace=false;
  gateOpenAnim=0; gateDoors.forEach(h=>h.rotation.x=0); // close doors
  photoFinish=[]; photoQueue=[];
  finishLineHidden=false;
  finishLineGroup.forEach(o=>o.visible=true);
  finishPoles.forEach(o=>o.visible=true);
  if(gateGroup && !gateGroup.parent) scene.add(gateGroup); // restore gate if removed mid-race
  deerObjs.forEach(d=>{
    if(!d) return;
    d.progress=P_GATE; d.place=0; d.finished=false;
    d.curLane=d.laneOff;  // live lane that merges inward during the race
    d.stretchLane=null;   // set when a closer swings wide in the stretch
    d.flightProg=-1; d.nextFlight=2.5+Math.random()*4;
    d.base   = 13.6 + Math.random()*0.8; // tight spread — nobody runs away with it
    d.isCloser = false;                // drama closer — assigned below
    d.surgeF = 0.10 + Math.random()*0.14; // long, slow surges — leaders hold real stints
    d.surgeP = Math.random()*Math.PI*2;
    d.amp    = 0.08 + Math.random()*0.07;  // ~12 lead changes a race
    d.speed  = d.base;
    const sp=trackPos(P_GATE, d.laneOff);
    d.group.position.set(sp.x, 0, sp.z);
    d.group.rotation.y=sp.ry;
    d.idleAct.stop();
    d.action.reset().play(); d.action.paused=false;
    d.mixer.setTime(Math.random()*2);
  });
  // COME-FROM-BEHIND DRAMA — one random deer per race is the designated closer:
  // slightly handicapped early so it sits mid-pack or worse, then unleashes a
  // monster kick through the final stretch. The wire cam tracks the charge.
  dramaCloser = deerObjs[Math.floor(Math.random()*N)] || null;
  if(dramaCloser){
    dramaCloser.isCloser = true;
    dramaCloser.base *= 0.965;  // runs off the pace — rubber-band keeps it in touch
    dramaCloser.amp = Math.min(dramaCloser.amp, 0.20); // steady, saving ground
    dramaCloserWins = Math.random() < 0.80;  // 1-in-5: the rally falls a nose short
  }
  // THE GRINCH — every third race he drops in from above and steals it
  raceCount++;
  grinchRace = (raceCount % 3 === 0);
  if(grinch){
    grinch.group.visible=false; grinch.tag.visible=false;
    grinch.finished=false; grinch.place=0; grinch.progress=0;
    grinch.dropping=false; grinch.landed=false; grinch.speed=0; grinch.dropY=0;
  }
  replayFrames=[]; replayRec=false; replayActive=false; replayT=0; lastRecT=-1;
}
function beginRace(){
  configureRace();
  overlay.classList.add('off');
  camBar.style.display='flex';
  preRace=true; preRaceTimer=0;
  // Deer idle at gate while camera shows them lined up
  deerObjs.forEach(d=>{ if(!d) return;
    d.action.paused=true; d.idleAct.reset().play();
  });
  // After PRE_RACE_DUR, show countdown then open gates
  setTimeout(()=>{
    showCountdown(()=>{ preRace=false; racing=true;
      ann.flags={}; ann.lastCall=0; ann.lastLeadIdx=-1; ann.lastLeadT=-10;
      say("And they're off!",{force:true,rate:1.25,pitch:1.15});
      gateOpenAnim=0.4; // doors fly open
      // Hide finish line until last deer clears the first curve
      finishLineGroup.forEach(o=>o.visible=false);
      finishPoles.forEach(o=>o.visible=false);
      finishLineHidden=true;
      deerObjs.forEach(d=>{ if(!d) return;
        d.idleAct.stop(); d.action.reset().play(); d.action.paused=false;
      });
    });
  }, PRE_RACE_DUR*1000);
}
function showCountdown(done){
  overlay.classList.remove('off');
  overlay.innerHTML='<div class="card"><div class="count" id="cnum">3</div></div>';
  let cnt=document.getElementById('cnum');
  const seq=['3','2','1','GO!']; let i=0;
  (function step(){
    if(i<seq.length){
      cnt.textContent=seq[i];
      cnt.style.animation='none'; void cnt.offsetWidth; cnt.style.animation='pop .85s ease';
      i++; setTimeout(step,750);
    } else { overlay.classList.add('off'); done(); }
  })();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function leader(){ let b=null; deerObjs.forEach(d=>{ if(d&&(!b||d.progress>b.progress)) b=d; }); return b; }
function idxOf(d){ return deerObjs.indexOf(d); }

// Track nose, elves, name tags to current deer/bone positions.
// Called from updateRace AND during the pre-race gate lineup.
// ── THE GRINCH ── every third race he drops in from above at the halfway point
// of the stretch and steals the race. Built from primitives — green fur, the
// stolen Santa coat and hat.
function buildGrinch(){
  const g=new THREE.Group();
  const fur=new THREE.MeshStandardMaterial({color:0x3fa63f,roughness:.85});
  const coat=new THREE.MeshStandardMaterial({color:0xcc1122,roughness:.6});
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});
  // Legs
  [-0.22,0.22].forEach(x=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.9,8),fur);
    leg.position.set(x,.45,0); g.add(leg);
  });
  // Body — pear-shaped, in the stolen Santa coat
  const body=new THREE.Mesh(new THREE.SphereGeometry(.5,12,10),coat);
  body.scale.set(1,1.25,.8); body.position.y=1.35; g.add(body);
  const trim=new THREE.Mesh(new THREE.CylinderGeometry(.42,.46,.14,12),white);
  trim.position.y=0.92; g.add(trim);
  // Arms (kept for the victory laugh)
  const arms=[];
  [-1,1].forEach(s=>{
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.08,.09,.8,8),fur);
    arm.position.set(s*.55,1.5,0); arm.rotation.z=s*0.6; arm.userData.s=s; g.add(arm);
  arms.push(arm);
  });
  // Head — green, slightly pointed
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),fur);
  head.scale.set(1,1.15,.95); head.position.y=2.15; g.add(head);
  // Sly grin — dark curved box
  const grin=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,.05),
    new THREE.MeshStandardMaterial({color:0x113311}));
  grin.position.set(0,2.05,.28); g.add(grin);
  // Santa hat: red cone flopped over + white pompom + brim
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.1,12),white);
  brim.position.y=2.42; g.add(brim);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(.3,.75,10),coat);
  cone.position.set(.1,2.75,0); cone.rotation.z=-.5; g.add(cone);
  const pom=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),white);
  pom.position.set(.38,2.95,0); g.add(pom);
  g.scale.setScalar(1.35);
  g.visible=false;
  scene.add(g);
  // Name tag — same canvas-sprite style as the deer
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const c2=cv.getContext('2d');
  c2.fillStyle='#2f9e44';
  c2.beginPath(); c2.roundRect(6,8,500,112,48); c2.fill();
  c2.fillStyle='#fff'; c2.font='bold 64px sans-serif';
  c2.textAlign='center'; c2.textBaseline='middle';
  c2.fillText('The Grinch',256,66);
  const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true,opacity:.95}));
  tag.scale.set(5.2,1.3,1); tag.visible=false;
  scene.add(tag);
  return {group:g, tag, arms, name:'The Grinch', progress:0, speed:0, finished:false,
          place:0, dropping:false, landed:false, dropY:0, curLane:0, stretchLane:null};
}

// ── GRINCH SPARKLE TRAIL ── gold particle pool, additive glow
const SPARK_N=160;
let sparkPts=null;
const sparks=[];
const SPARK_COLORS=[[1,.1,.1],[1,.72,0],[.05,.85,.2],[.1,.5,1],[1,.15,.8],[.55,.15,1],[0,.9,.9]];
function initSparkles(){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(SPARK_N*3);
  const col=new Float32Array(SPARK_N*3);
  for(let i=0;i<SPARK_N;i++){ pos[i*3+1]=-999; sparks.push({life:0}); }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  // Round soft-glow sprite — without a texture, points render as hard squares
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const c2=cv.getContext('2d');
  const grad=c2.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.35,'rgba(255,255,255,.9)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  c2.fillStyle=grad; c2.fillRect(0,0,64,64);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.PointsMaterial({size:2.8,map:tex,vertexColors:true,transparent:true,
    opacity:.95,blending:THREE.NormalBlending,depthWrite:false,sizeAttenuation:true});
  sparkPts=new THREE.Points(geo,mat);
  sparkPts.frustumCulled=false;
  scene.add(sparkPts);
}
let sparkEmitIdx=0;
function emitSparkles(x,y,z,n){
  if(!sparkPts) initSparkles();
  const col=sparkPts.geometry.attributes.color.array;
  for(let k=0;k<n;k++){
    const i=sparkEmitIdx; sparkEmitIdx=(sparkEmitIdx+1)%SPARK_N;
    const s=sparks[i];
    s.life=0.7+Math.random()*0.6;
    s.x=x+(Math.random()-0.5)*1.6;
    s.y=y+0.6+Math.random()*2.4;
    s.z=z+(Math.random()-0.5)*1.6;
    s.vx=(Math.random()-0.5)*2.6;
    s.vy=0.6+Math.random()*2.6;
    s.vz=(Math.random()-0.5)*2.6;
    const c=SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
  }
  sparkPts.geometry.attributes.color.needsUpdate=true;
}
function updateSparkles(dt){
  if(!sparkPts) return;
  const pos=sparkPts.geometry.attributes.position.array;
  for(let i=0;i<SPARK_N;i++){
    const s=sparks[i];
    if(s.life>0){
      s.life-=dt;
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.z+=s.vz*dt;
      s.vy-=2.5*dt;
      pos[i*3]=s.x; pos[i*3+1]=(s.life>0)?s.y:-999; pos[i*3+2]=s.z;
    } else pos[i*3+1]=-999;
  }
  sparkPts.geometry.attributes.position.needsUpdate=true;
}
// ── GRINCH VICTORY LAUGH ── head back, arms up, whole body rocking
function grinchLaughPose(t){
  if(!grinch||!grinch.arms) return;
  const rock=Math.sin(t*10)*0.14;
  grinch.group.rotation.z=rock;
  grinch.group.rotation.x=-0.18+Math.sin(t*10+1.3)*0.05;  // head thrown back
  grinch.arms.forEach(a=>{ a.rotation.z=a.userData.s*(2.35+Math.sin(t*10)*0.18); });
}
function grinchLaughReset(){
  if(!grinch||!grinch.arms) return;
  grinch.group.rotation.z=0; grinch.group.rotation.x=0;
  grinch.arms.forEach(a=>{ a.rotation.z=a.userData.s*0.6; });
}
function updateGrinch(dt){
  if(!grinchRace || !racing) return;
  if(!grinch) grinch=buildGrinch();
  if(grinch.finished && grinch.speed<=0.1) return;
  const ld=leader();
  if(!ld) return;
  const lf=(ld.progress-P_GATE)/1.25;
  // DROP-IN: halfway down the final stretch
  if(!grinch.dropping && !grinch.landed && lf>=0.90){
    grinch.progress = ld.progress + 3/CIRC;   // materialises just ahead of the leader
    grinch.dropping=true; grinch.dropY=42;
    grinch.group.visible=true; grinch.tag.visible=true;
    say('Wait… the GRINCH has dropped in from the sky!',{force:true,rate:1.25,pitch:1.3});
  }
  if(grinch.dropping){
    grinch.dropY -= dt*34;                    // ~1.2s fall
    grinch.progress += ld.speed*dt/CIRC;      // drifts forward with the field
    if(grinch.dropY<=0){ grinch.dropY=0; grinch.dropping=false; grinch.landed=true; grinch.speed=ld.speed;
      say("He's on the track! The GRINCH is RUNNING, and he is NOT here to spread cheer!",{force:true,rate:1.3,pitch:1.28}); }
  } else if(grinch.landed && !grinch.finished){
    // Gap-aware steal — same maths as the closer, with Grinch-sized margins
    let rival=null;
    deerObjs.forEach(o=>{ if(o && !o.finished){ if(!rival||o.progress>rival.progress) rival=o; }});
    if(rival){
      const gap=(rival.progress-grinch.progress)*CIRC;
      const remain=Math.max(4,(P_FINISH-grinch.progress)*CIRC);
      if(gap>0){
        const need=(rival.speed + gap/(remain*0.80/Math.max(4,grinch.speed)));
        grinch.speed=Math.min(grinch.speed*2.2, Math.max(grinch.speed, need*1.10));
      } else {
        grinch.speed=Math.max(grinch.speed, rival.speed*1.08);
      }
    }
    grinch.progress += grinch.speed*dt/CIRC;
    if(grinch.progress>=P_FINISH && !grinch.finished){
      grinch.finished=true; grinch.place=++finishCounter;
      photoQueue.push(grinch);
    }
  } else if(grinch.finished){
    grinch.speed=Math.max(0, grinch.speed - dt*8);
    if(grinch.speed>0.1) grinch.progress += grinch.speed*dt/CIRC;
  }
  // Place on the track
  if(grinch.group.visible){
    const gp=trackPos(grinch.progress, 0);
    const bob=grinch.landed ? Math.abs(Math.sin(raceTime*11))*0.25 : 0;
    grinch.group.position.set(gp.x, grinch.dropY + bob, gp.z);
    grinch.group.rotation.y=gp.ry;
    // Big sparkle trail while he's on the move
    if(grinch.speed>0.5 || grinch.dropping)
      emitSparkles(gp.x, grinch.dropY, gp.z, grinch.dropping?5:3);
    // Victory laugh — from just before the wire until he pulls up
    const toLine=(P_FINISH-grinch.progress)*CIRC;
    if(toLine<20) grinchLaughPose(raceTime); else grinchLaughReset();
    grinch.tag.position.set(gp.x, grinch.dropY + 4.0, gp.z);
    const tagSc=(activeCam==='blimp')?15.0:5.2;
    grinch.tag.scale.set(tagSc, tagSc*0.25, 1);
  }
}

function trackAttachments(){
  const rud=deerObjs[8];
  if(rud&&rud.noseGroup&&rud.headNode){
    const wp=new THREE.Vector3(), wq=new THREE.Quaternion();
    rud.headNode.getWorldPosition(wp); rud.headNode.getWorldQuaternion(wq);
    const off=new THREE.Vector3(noseOff.x,noseOff.y,noseOff.z);
    off.applyQuaternion(wq);
    rud.noseGroup.position.copy(wp).add(off);
  }
  const _v=new THREE.Vector3();
  // STRETCH DRIVE: deer run nose-to-nose, so 3-row staggering isn't enough —
  // fan the tags out by RUNNING ORDER instead (adjacent runners = adjacent
  // ranks = clearly different heights). Kicks in as they round the final turn.
  let stretchRank=null;
  {
    const ld0=leader();
    if(racing && ld0 && (ld0.progress-P_GATE)/1.25 > 0.72){
      stretchRank=new Map();
      [...deerObjs].filter(Boolean).sort((a,b)=>b.progress-a.progress)
        .forEach((d,i)=>stretchRank.set(d,i));
    }
  }
  deerObjs.forEach(d=>{
    if(!d||!d.elf) return;
    if(d.backBone){ d.backBone.getWorldPosition(_v); d.elf.position.copy(_v); d.elf.position.y+=0.9; }
    else { d.elf.position.set(d.group.position.x, d.group.position.y+2.8, d.group.position.z); }
    if(d.tag){
      const row=idxOf(d)%3;
      // In blimp mode tags float much higher so they're visible above the oval
      let tagH = (activeCam==='blimp') ? 12+row*3 : 4.9+row*0.95;
      if(stretchRank && activeCam!=='blimp') tagH = 4.2 + stretchRank.get(d)*0.85;
      d.tag.position.set(d.group.position.x, d.group.position.y+tagH, d.group.position.z);
      // Scale up for blimp — sprites are screen-space but position matters for occlusion
      const tagSc = (activeCam==='blimp') ? 15.0 : 5.2;
      d.tag.scale.set(tagSc, tagSc*0.25, 1);
    }
    d.elf.rotation.y=d.group.rotation.y;
  });
}

// ── PHOTO FINISH ──────────────────────────────────────────────────────────────
let finishPoles=[]; // gantry poles — hidden during photo capture
let fenceGroup=null; // posts + rails — hidden during photo capture so nothing blocks the lens
let finishLineGroup=[]; // banner + stripe — hidden at race start, restored when last deer exits turn 1
let finishLineHidden=false;
let photoFinish=[]; // {name, place, img}
let photoQueue=[];  // deer waiting for photo capture at end of frame
function capturePhotoFinish(d){
  if(photoFinish.length>=3) return;
  // Save camera + renderer state (blimp rolls the up vector; canvas may be landscape)
  const sp=camera.position.clone(), sq=camera.quaternion.clone(), sf=camera.fov;
  const su=camera.up.clone(), sa=camera.aspect;
  const sz=new THREE.Vector2(); renderer.getSize(sz);
  // SNAP the deer so its NOSE is exactly on the line edge (nose ~1.3m ahead of centre)
  const gpx=d.group.position.x, gpz=d.group.position.z, gry=d.group.rotation.y, gpy=d.group.position.y;
  const lane = (d.stretchLane!==undefined && d.stretchLane!==null) ? d.stretchLane : d.curLane;
  const snapP = P_FINISH - 1.3/CIRC;   // centre 1.3m before the line → nose ON the line
  const spos = trackPos(snapP, lane);
  d.group.position.set(spos.x, 0, spos.z); d.group.rotation.y=spos.ry;
  // Camera EXACTLY on the finish-line axis — shooting straight down the line
  // from the outside rail, the classic photo-finish alignment.
  const camPt = trackPos(0, TW/2 + 10);   // on the line, outside the rail
  const aimPt = trackPos(0, lane);        // on the line, at the deer's lane
  camera.up.set(0,1,0);  // upright portrait — track at the bottom of the shot
  camera.position.set(camPt.x, 1.7, camPt.z);
  camera.lookAt(aimPt.x, 1.4, aimPt.z);
  camera.fov=30;
  // Force a PORTRAIT capture regardless of device orientation
  renderer.setSize(480, 854, false);
  camera.aspect=480/854; camera.updateProjectionMatrix();
  // Hide everything that could block the lens: gantry poles + entire fence
  finishPoles.forEach(p=>p.visible=false);
  if(fenceGroup) fenceGroup.visible=false;
  renderer.render(scene, camera);
  const img=renderer.domElement.toDataURL('image/jpeg', 0.7);
  finishPoles.forEach(p=>p.visible=true);
  if(fenceGroup) fenceGroup.visible=true;
  photoFinish.push({name:d.name, place:d.place, img});
  // Restore deer, camera, renderer
  d.group.position.set(gpx, gpy, gpz); d.group.rotation.y=gry;
  renderer.setSize(sz.x, sz.y, false);
  camera.aspect=sa; camera.up.copy(su);
  camera.position.copy(sp); camera.quaternion.copy(sq);
  camera.fov=sf; camera.updateProjectionMatrix();
}
// ── INSTANT REPLAY playback ──────────────────────────────
let replayWinIdx=0, replayWinGrinch=false;
function startReplay(){
  if(replayFrames.length<2) return;
  replayActive=true; replayT=replayFrames[0].t;
  const w=raceWinner();
  replayWinGrinch = (grinch && w===grinch);
  replayWinIdx = replayWinGrinch ? -1 : Math.max(0, deerObjs.indexOf(w));
  const chip=document.getElementById('tagChip'), nameEl=document.getElementById('tagName');
  chip.style.background = replayWinGrinch ? '#2f9e44' : SILKS[replayWinIdx];
  nameEl.textContent = (w?w.name:'').toUpperCase();
  overlay.classList.add('off');
  document.getElementById('replayExit').style.display='block';
  say("Let's take another look!",{force:true,rate:1.1});
  // Deer were crossfaded to idle after the race — put them back at a run
  deerObjs.forEach(d=>{ if(d){ d.idleAct.stop(); d.action.reset().play(); } });
}
function endReplay(){
  replayActive=false;
  replayWasSlow=false;
  if(fenceGroup) fenceGroup.visible=true;
  document.getElementById('replayExit').style.display='none';
  document.getElementById('winnerTag').style.display='none';
  deerObjs.forEach(d=>{ if(d){ d.action.stop(); d.idleAct.reset().play(); } });
  showResults();
}
function updateReplay(dt){
  const frames=replayFrames, last=frames[frames.length-1];
  let i=0;
  while(i<frames.length-2 && frames[i+1].t<=replayT) i++;
  const a=frames[i], b=frames[Math.min(i+1,frames.length-1)];
  const span=Math.max(1e-4, b.t-a.t);
  const f=Math.max(0, Math.min(1,(replayT-a.t)/span));
  const L=(x,y)=>x+(y-x)*f;
  const slow = a.lp>=REPLAY_SLOW_PROG;         // last 200 yards
  const rate = slow?0.28:1.0;
  deerObjs.forEach((d,k)=>{ if(!d) return;
    const j=k*4;
    d.group.position.set(L(a.d[j],b.d[j]), L(a.d[j+2],b.d[j+2]), L(a.d[j+1],b.d[j+1]));
    d.group.rotation.y=L(a.d[j+3],b.d[j+3]);
    d.mixer.timeScale=1.5*rate; d.mixer.update(dt);
  });
  if(grinch){
    if(a.g||b.g){
      const ga=a.g||b.g, gb=b.g||a.g;
      grinch.group.visible=true; grinch.tag.visible=true;
      grinch.group.position.set(L(ga[0],gb[0]), L(ga[2],gb[2]), L(ga[1],gb[1]));
      grinch.group.rotation.y=L(ga[3],gb[3]);
      emitSparkles(grinch.group.position.x, grinch.group.position.y, grinch.group.position.z, 3);
      // Laugh again for the cameras near the wire (finish line is at z≈0)
      if(Math.abs(grinch.group.position.z)<22 && grinch.group.position.x>TR-TW) grinchLaughPose(replayT);
      else grinchLaughReset();
      grinch.tag.position.set(grinch.group.position.x, grinch.group.position.y+4.0, grinch.group.position.z);
    } else { grinch.group.visible=false; grinch.tag.visible=false; }
  }
  trackAttachments();
  // Winner's interpolated position (deer or Grinch)
  let wx=null,wy=0,wz=null;
  if(replayWinGrinch){
    if(a.g||b.g){ const ga=a.g||b.g, gb=b.g||a.g;
      wx=L(ga[0],gb[0]); wy=L(ga[2],gb[2]); wz=L(ga[1],gb[1]); }
  } else {
    const j=replayWinIdx*4;
    wx=L(a.d[j],b.d[j]); wy=L(a.d[j+2],b.d[j+2]); wz=L(a.d[j+1],b.d[j+1]);
  }
  // Winner's direction of travel from the recording itself
  let fwx=0,fwz=-1;
  if(wx!==null){
    const j=replayWinIdx*4;
    const dx0 = replayWinGrinch ? ((b.g&&a.g)?b.g[0]-a.g[0]:0) : b.d[j]-a.d[j];
    const dz0 = replayWinGrinch ? ((b.g&&a.g)?b.g[1]-a.g[1]:0) : b.d[j+1]-a.d[j+1];
    const dl=Math.hypot(dx0,dz0);
    if(dl>1e-4){ fwx=dx0/dl; fwz=dz0/dl; }
  }
  // Three replay phases keyed on recorded leader progress
  const fx=L(a.fx,b.fx), fz=L(a.fz,b.fz);
  const tagEl=document.getElementById('winnerTag');
  let px,pz,py,fov,ax,ay,az;
  if(slow){
    // PHASE C — SLO-MO AT THE WIRE: fixed camera beside the finish line,
    // panning with the LEADER so the nose touching the line is the shot.
    // Fence hidden so no rail blocks the crossing.
    const fpt=trackPos(0, TW/2+8);
    px=fpt.x; pz=fpt.z-3; py=2.2; fov=30;
    ax=(wx!==null)?wx:fx; ay=1.2; az=(wz!==null)?wz:fz;
    tagEl.style.display='none';
    if(fenceGroup) fenceGroup.visible=false;
    if(!replayWasSlow){
      // SNAP on phase entry — only ~10 yards of slo-mo, no time to lerp in
      camPos.set(px,py,pz); camAim.set(ax,ay,az);
    }
    replayWasSlow=true;
    camLabel.innerHTML='<span class="rec">●</span> REPLAY — SLO-MO';
  } else if(a.lp>=1.79 && wx!==null){
    // PHASE B — THE TAG SHOT: elevated, from behind the winner, running away
    // from camera toward the wire (broadcast style)
    px=wx-fwx*30; pz=wz-fwz*30; py=17; fov=40;
    ax=wx+fwx*16; ay=0; az=wz+fwz*16;
    tagEl.style.display='block';
    camLabel.innerHTML='<span class="rec">●</span> INSTANT REPLAY';
    if(fenceGroup) fenceGroup.visible=true;
    replayWasSlow=false;
  } else {
    // PHASE A — outside-rail tracking through the final turn
    if(fenceGroup) fenceGroup.visible=true;
    replayWasSlow=false;
    if(fz>STR){
      let rx=fx-0, rz=fz-STR; const rl=Math.hypot(rx,rz)||1; rx/=rl; rz/=rl;
      px=fx+rx*26; pz=fz+rz*26; py=8; fov=44;
    } else { px=fx+TW/2+14; pz=fz; py=6; fov=44; }
    ax=fx; ay=1.6; az=fz;
    tagEl.style.display='none';
    camLabel.innerHTML='<span class="rec">●</span> INSTANT REPLAY';
  }
  const sm=1-Math.exp(-4*dt);
  camPos.lerp(new THREE.Vector3(px,py,pz), sm);
  camAim.lerp(new THREE.Vector3(ax,ay,az), sm);
  camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camAim);
  camera.fov += (fov-camera.fov)*sm; camera.updateProjectionMatrix();
  // Project the winner to screen space and stretch the tag wedge down to it
  if(tagEl.style.display==='block' && wx!==null){
    camera.updateMatrixWorld();
    const v=new THREE.Vector3(wx, wy+2.4, wz).project(camera);
    if(v.z<1){
      const sx=(v.x*0.5+0.5)*window.innerWidth;
      const sy=(-v.y*0.5+0.5)*window.innerHeight;
      const bEl=document.getElementById('tagBanner');
      const br=bEl.getBoundingClientRect();
      const bx=br.left+br.width/2, by=br.bottom-2;
      document.getElementById('tagPoly').setAttribute('points',
        `${bx-22},${by} ${bx+22},${by} ${sx},${sy}`);
    }
  }
  replayT += dt*rate;
  if(replayT > last.t + 0.4) endReplay();
}

function raceWinner(){
  if(grinch && grinch.place===1) return grinch;
  return deerObjs.find(d=>d&&d.place===1) || null;
}
function topN(n){
  return [...deerObjs].filter(Boolean).sort((a,b)=>b.progress-a.progress).slice(0,n);
}
function packXZ(){
  // Average position of top 4 leaders for camera tracking
  const sorted=topN(4);
  if(sorted.length===0) return {x:TC_X, z:TC_Z};
  let x=0,z=0; sorted.forEach(d=>{x+=d.group.position.x;z+=d.group.position.z;});
  return{x:x/sorted.length, z:z/sorted.length};
}
// Bounding info for top-3 leaders: centre + spread. Centre is weighted toward
// the race leader so the leader is guaranteed prominent in every shot.
function leadersFrame(){
  const t=topN(3);
  if(t.length===0) return {x:TC_X, z:TC_Z, spread:10};
  // LAG COMPENSATION: use each leader's PREDICTED position 0.4s ahead so the
  // camera's smoothing lag never lets the leader escape the frame.
  const pred = d => {
    const p = d.finished ? d.progress : d.progress + d.speed*0.55/CIRC;
    return trackPos(p, d.curLane!==undefined?d.curLane:d.laneOff);
  };
  // Weighted centre: leader counts triple
  const lp = pred(t[0]);
  let x=lp.x*3, z=lp.z*3, w=3;
  t.forEach(d=>{ const pp=pred(d); x+=pp.x; z+=pp.z; w++; });
  x/=w; z/=w;
  let spread=4;
  for(const d of t){
    const pp=pred(d);
    spread=Math.max(spread, Math.hypot(pp.x-x, pp.z-z)*2);
  }
  return {x, z, spread};
}

// ── UPDATE RACE ───────────────────────────────────────────────────────────────
function updateRace(dt){
  raceTime+=dt;
  // Remove gate structure once leaders are halfway (won't be there on return)
  if(gateGroup && gateGroup.parent){
    const ldChk=leader();
    if(ldChk && (ldChk.progress-P_GATE) > 0.625){ scene.remove(gateGroup); }
  }
  // Restore finish line once the LAST deer has cleared the first curve
  if(finishLineHidden){
    const last=deerObjs.filter(Boolean).sort((a,b)=>a.progress-b.progress)[0];
    const firstCurveClear = P_GATE + 0.25; // gate + quarter lap
    if(last && last.progress > firstCurveClear){
      finishLineGroup.forEach(o=>o.visible=true);
      finishPoles.forEach(o=>o.visible=true);
      finishLineHidden=false;
    }
  }
  deerObjs.forEach(d=>{
    if(!d) return;
    if(d.finished){
      // Decelerate to a walk then stop — keep moving on the track
      d.speed = Math.max(0, d.speed - dt * 8);
      if(d.speed > 0.1){
        d.progress += d.speed*dt/CIRC;
        const fp=trackPos(d.progress, d.curLane);
        d.group.position.x=fp.x; d.group.position.z=fp.z;
        d.group.rotation.y=fp.ry; d.group.position.y=0;
      }
      d.mixer.timeScale = Math.max(0.05, d.speed/d.base);
      d.mixer.update(dt);
      return;
    }
    // Speed — base + sinusoidal surges (lead changes come from these)
    d.speed=Math.max(2, d.base*(1+d.amp*Math.sin(d.surgeF*raceTime+d.surgeP))*(0.985+Math.random()*.03));
    // RUBBER-BAND: compress the pack — the front is eased, the back is helped,
    // so the surges above constantly shuffle the running order. Neck-and-neck racing.
    const fracDone=(d.progress-P_GATE)/1.25;
    {
      let mp=0, nn=0;
      deerObjs.forEach(o=>{ if(o && !o.finished){ mp+=o.progress; nn++; } });
      if(nn>0){
        mp/=nn;
        const gapM=(d.progress-mp)*CIRC;           // metres ahead(+)/behind(-) of pack centre
        // The closer is exempt from the tow before its kick — it stays at the back
        // Closer: light tow at the back early, FULLY exempt during its kick —
        // otherwise the band drags it back into the pack after it takes the lead
        const bandStr = d.isCloser ? (fracDone>0.78 ? 0 : (gapM<0 ? 0.002 : 0.006)) : 0.006;
        d.speed *= Math.max(0.85, Math.min(1.15, 1 - gapM*bandStr));
      }
    }
    if(fracDone>0.85 && !d.isCloser){
      const rank=topN(9).indexOf(d);
      d.speed += rank*0.10*dt*8;          // mild pack tightening in the drive
    }
    if(d.isCloser && fracDone>0.78){
      // THE CHARGE — gap-aware kick guaranteeing the closer runs down the leader
      // just before the wire. Speed is set from what's needed, so it always looks
      // like a monster rally rather than a teleport.
      // Pace off the best of the REST of the field (works whether chasing or leading)
      let rival=null;
      deerObjs.forEach(o=>{ if(o && o!==d && !o.finished){
        if(!rival || o.progress>rival.progress) rival=o;
      }});
      if(rival){
        const gap=(rival.progress-d.progress)*CIRC;          // metres to make up (− = leading)
        const remain=Math.max(6,(P_FINISH-d.progress)*CIRC); // metres left to run
        if(gap>0){
          // Winning races: catch at ~90% of the remaining run — pass before the wire.
          // Losing races: draw alongside, then the nose-cap keeps it a whisker short.
          const catchAt = dramaCloserWins ? 0.90 : 1.06;
          const margin  = dramaCloserWins ? 1.06 : 1.0;
          const need=(rival.speed + gap/(remain*catchAt/Math.max(4,d.speed)));
          d.speed=Math.min(d.speed*1.65, Math.max(d.speed, need*margin));
          if(!dramaCloserWins && gap<2.5) d.speed=Math.max(Math.min(d.speed, rival.speed*0.99), rival.speed*0.975);
        } else if(dramaCloserWins){
          d.speed=Math.max(d.speed, rival.speed*1.05);       // in front — hold off the rally
        }
      }
      // Swing 3 lanes wide for the outside charge
      d.stretchLane = -(TW/2)+1.2 + 3.4;
    }
    d.progress += d.speed*dt/CIRC;

    // Fly — NO-FLY ZONE from the final turn home: hooves on the dirt for the drive
    if(d.flightProg<0){
      if(raceTime>=d.nextFlight && fracDone<0.72){
        d.flightProg=0; d.flightDur=1.4+Math.random()*2; d.flightAlt=2+Math.random()*5;
      }
      d.group.position.y=0;
    } else {
      d.flightProg+=dt/d.flightDur;
      if(d.flightProg>=1){ d.flightProg=-1; d.group.position.y=0; d.nextFlight=raceTime+1.5+Math.random()*4; }
      else { d.group.position.y=Math.sin(d.flightProg*Math.PI)*d.flightAlt; }
    }

    // Position on oval
    // Merge toward the inside rail after the start; in the stretch, surging
    // closers override with a wide outside lane
    const distRun=(d.progress-P_GATE)*CIRC;
    if(distRun > 15){
      const target = (d.stretchLane!==undefined && d.stretchLane!==null)
        ? d.stretchLane
        : -(TW/2)+1.2+(idxOf(d)%3)*0.9;
      const rate = (d.stretchLane!==undefined && d.stretchLane!==null) ? 0.9 : 0.35;
      d.curLane += (target-d.curLane)*Math.min(1, dt*rate);
    }
    const sp=trackPos(d.progress, d.curLane);
    d.group.position.x=sp.x;
    d.group.position.z=sp.z;
    d.group.rotation.y=sp.ry;
    d.mixer.timeScale=1.5; d.mixer.update(dt);

    // Finish — keep position/movement, just flag and start crossfade
    if(d.progress>=P_FINISH && !d.finished){
      d.finished=true; d.place=++finishCounter;
      d.group.position.y=0; d.flightProg=-1;
      d.idleAct.reset().play(); d.action.crossFadeTo(d.idleAct, 1.5, false);
      photoQueue.push(d); // capture AFTER all tracking completes this frame
    }
  });

  updateGrinch(dt);
  announcerUpdate();

  // REPLAY RECORDING — starts as the leader rounds into the final turn
  {
    const ldR=leader();
    if(ldR){
      const lfR=(ldR.progress-P_GATE)/1.25;
      if(!replayRec && lfR>=0.70) replayRec=true;
      if(replayRec && raceTime-lastRecT>=1/30 && replayFrames.length<3000){
        lastRecT=raceTime;
        const t3=topN(3);
        let fx=0,fz=0; t3.forEach(o=>{fx+=o.group.position.x; fz+=o.group.position.z;});
        fx/=t3.length; fz/=t3.length;
        const dd=[];
        deerObjs.forEach(o=>{ if(o) dd.push(o.group.position.x,o.group.position.z,o.group.position.y,o.group.rotation.y); });
        let gg=null;
        if(grinch && grinch.group.visible){
          gg=[grinch.group.position.x,grinch.group.position.z,grinch.group.position.y,grinch.group.rotation.y];
        }
        replayFrames.push({t:raceTime, lp:ldR.progress, fx, fz, d:dd, g:gg});
      }
    }
  }
  trackAttachments();

  // Photo finish — captured now that deer, elf, tag, nose are all in final positions
  while(photoQueue.length){ capturePhotoFinish(photoQueue.shift()); }

  // HUD
  const ld=leader();
  if(ld) leaderEl.innerHTML=finishCounter>0
    ?'LEADER <b>'+(raceWinner()||ld).name.toUpperCase()+'</b>'
    :'LEADER <b>'+ld.name.toUpperCase()+'</b>';
  timerEl.textContent=raceTime.toFixed(1)+'s';

  if(finishCounter>=N&&!finishedAll) finishedAll=true;
  if(finishedAll){ postTimer+=dt;
    if(postTimer>0.8&&!winnerCamActive&&racing){ winnerCamActive=true; racing=false; winnerCamTimer=0; }
  }
}

// ── CAMERA DIRECTOR ───────────────────────────────────────────────────────────
function directCamera(dt){
  // Smooth FOV transitions
  currentFov += (targetFov - currentFov) * Math.min(1, dt * 3);
  if(Math.abs(currentFov - camera.fov) > 0.05){
    camera.fov = currentFov; camera.updateProjectionMatrix();
  }

  // Winner cinematic — orbit winner for 4s before results screen
  if(winnerCamActive){
    winnerCamTimer += dt;
    const w = raceWinner();
    if(w){
      // Mingling shot — slow wide orbit around the pack as they mill about
      const pk = packXZ();
      const cx=(pk.x+w.group.position.x)/2, cz=(pk.z+w.group.position.z)/2;
      const angle = winnerCamTimer * 0.45;
      const tp = new THREE.Vector3(cx + Math.sin(angle)*24, 7, cz + Math.cos(angle)*24);
      const a = 1-Math.exp(-3*dt);
      camPos.lerp(tp,a); camAim.lerp(new THREE.Vector3(cx,2,cz),a);
      camera.position.copy(camPos); camera.lookAt(camAim);
      targetFov=44; camLabel.innerHTML='<span class="rec">●</span> '+w.name.toUpperCase()+' WINS!';
    }
    if(winnerCamTimer>5.0){ winnerCamActive=false; showResults(); }
    return;
  }

  // Pre-race: all deer head-on in the gate
  if(preRace){
    // Camera positioned close in front of the gate, looking straight at the
    // horses head-on. Tight framing on the pack, not the empty finish straight.
    const gp = trackPos(P_GATE, 0);     // gate centre
    const fp = trackPos(0, 0);          // finish line centre (for direction only)
    const dx = gp.x - fp.x, dz = gp.z - fp.z;
    const dist = Math.sqrt(dx*dx+dz*dz);
    const nx = dx/dist, nz = dz/dist;   // unit vector from finish toward gate
    // Head-on shot framing ALL 9 horses across the gate.
    // Gate width = 9 x 1.6m = 14.4m. PORTRAIT aspect (~0.46) shrinks horizontal
    // FOV: at vertical FOV 60 horizontal is ~30°, so 30m out covers ~16m width.
    camPos.set(gp.x - nx*30, 3.5, gp.z - nz*30);
    camAim.set(gp.x, 2.0, gp.z);
    camera.position.copy(camPos); camera.lookAt(camAim);
    camLabel.innerHTML='<span class="rec">●</span> STARTING GATE';
    currentFov=targetFov=60;
    camera.fov=60; camera.updateProjectionMatrix();
    return;
  }

  let mode=camMode;
  if(mode==='auto'){
    const ld=leader();
    const prog=ld ? Math.min(1,(ld.progress-P_GATE)/1.25) : 0;
    // Broadcast-style directing — mirrors a real horse-race telecast:
    // few cuts, long continuous pans, telephoto on the backstretch,
    // head-on turning for home, one locked wire cam through the stretch.
    if(raceTime<2){
      autoPick='gate_headon';          // the break — hold the head-on gate shot 2s
    } else if(prog<0.20){
      autoPick='wire';                 // first pass down the homestretch — wire cam pans
    } else if(prog<0.45){
      autoPick='grandstand';           // through turn 1 into the backstretch
    } else if(prog<0.70){
      // Backstretch — cut between crane, telephoto, and one blimp look
      autoCutTimer-=dt;
      if(autoCutTimer<=0 || (autoPick!=='crane'&&autoPick!=='telephoto'&&autoPick!=='blimp')){
        const pool=['crane','telephoto','crane','blimp','crane'];
        let pick; do{pick=pool[Math.floor(Math.random()*pool.length)];}while(pick===autoPick);
        autoPick=pick; autoCutTimer=4+Math.random()*2;
      }
    } else if(prog<0.85){
      autoPick='headon_low';           // far turn — field turns for home
    } else if(prog<0.90){
      autoPick='wire';                 // stretch run — zoom tracks the late surge
    } else {
      autoPick='grandstand';           // halfway to the wire — side view to the line
    }
    mode=autoPick;
  }
  activeCam=mode;

  const ld=leader(), pc=packXZ();
  const raceFrac = ld ? Math.min(1,(ld.progress-P_GATE)/1.25) : 0;
  let tp=new THREE.Vector3(), ta=new THREE.Vector3(), sm=2.2;
  targetFov=54;

  if(mode==='gate_headon'){
    // Identical framing to the pre-race shot — held as the field breaks and
    // charges straight at the lens for the first five seconds.
    const gp=trackPos(P_GATE,0), fp0=trackPos(0,0);
    const ddx=gp.x-fp0.x, ddz=gp.z-fp0.z;
    const dl=Math.sqrt(ddx*ddx+ddz*ddz)||1;
    const nx=ddx/dl, nz=ddz/dl;
    camPos.set(gp.x - nx*30, 3.5, gp.z - nz*30);
    camAim.set(gp.x, 2.0, gp.z);
    camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camAim);
    camLabel.innerHTML='<span class="rec">●</span> THE BREAK';
    currentFov=targetFov=60;
    camera.fov=60; camera.updateProjectionMatrix();
    return;

  } else if(mode==='gate'){
    const gp=trackPos(P_GATE,0);
    tp.set(gp.x, 4, gp.z-35); ta.set(gp.x, 2, gp.z+5);
    camLabel.innerHTML='<span class="rec">●</span> STARTING GATE'; targetFov=55; sm=1.5;

  } else if(mode==='grandstand'){
    // Side tracking — distance scales with leader spread (tight when bunched, wide when spread)
    const lf=leadersFrame();
    const finalRun = raceFrac>0.88;   // the run to the line — punch in close
    // On Grinch races HE is the story — the finish camera follows him laughing
    // across the line instead of the deer behind him
    let cx=lf.x, cz=lf.z;
    if(finalRun && grinchRace && grinch && grinch.group.visible && grinch.speed>0.5){
      cx=grinch.group.position.x; cz=grinch.group.position.z;
    }
    const dist = finalRun ? 4.5 + lf.spread*0.5 : 6 + lf.spread*0.8;
    tp.set(cx + (TW/2 + dist), finalRun ? 2.4+lf.spread*0.1 : 3+lf.spread*0.15, cz);
    ta.set(cx, 2, cz);
    if(finalRun) targetFov=44;
    camLabel.innerHTML='<span class="rec">●</span> GRANDSTAND'; sm=finalRun?4.0:2.5;

  } else if(mode==='gate_crane'){
    // CRANE from start gate to first curve — high, behind gate, watches the burst out
    const gp=trackPos(P_GATE, 0);
    const fx=Math.sin(gp.ry), fz=Math.cos(gp.ry); // gate facing direction
    const lf=leadersFrame();
    // Camera high and BEHIND the gate (opposite to race direction)
    tp.set(gp.x - fx*30, 38, gp.z - fz*30);
    // Aim at the leaders as they pull away
    ta.set(lf.x, 2, lf.z);
    camLabel.innerHTML='<span class="rec">●</span> CRANE'; targetFov=52; sm=2.5;

  } else if(mode==='crane'){
    // High crane — frames leaders, zooms with spread
    const lf=leadersFrame();
    tp.set(lf.x + 12, 25 + lf.spread*0.8, lf.z - (18 + lf.spread*0.6));
    ta.set(lf.x, 0, lf.z + 5);
    camLabel.innerHTML='<span class="rec">●</span> CRANE'; targetFov=48; sm=1.5;

  } else if(mode==='blimp'){
    // Blimp tracks the PACK from above, zoomed in enough that deer and name
    // tags are readable. Slight Z offset avoids gimbal lock; up-vector rolled
    // 90° so the track direction reads vertically on a portrait screen.
    const pk=packXZ();
    camPos.set(pk.x, 175, pk.z + 32);
    camAim.set(pk.x, 0, pk.z);
    camera.position.copy(camPos);
    camera.up.set(1,0,0);
    camera.lookAt(camAim);
    currentFov=targetFov=58;
    camera.fov=58; camera.updateProjectionMatrix();
    camLabel.innerHTML='<span class="rec">●</span> BLIMP';
    return;

  } else if(mode==='telephoto'){
    // Long lens on the leaders — compression effect
    const lf=leadersFrame();
    tp.set(lf.x + TR + TW + 45, 5, lf.z);
    ta.set(lf.x, 2, lf.z);
    camLabel.innerHTML='<span class="rec">●</span> TELEPHOTO';
    targetFov=Math.max(14, Math.min(24, lf.spread*1.2));
    sm = raceFrac>0.6 ? 3.0 : 1.8;

  } else if(mode==='headon_low'){
    // Ground level facing oncoming leaders
    const lf=leadersFrame();
    if(ld){
      const ahead=trackPos(ld.progress + 18/CIRC, 0);
      tp.set(ahead.x, 1.2, ahead.z);
      ta.set(lf.x, 2, lf.z);
    }
    camLabel.innerHTML='<span class="rec">●</span> LOW HEAD-ON';
    targetFov=Math.max(28, Math.min(46, lf.spread*2.2)); sm=3.5;

  } else if(mode==='drone'){
    const lf=leadersFrame();
    if(raceFrac > 0.955 && ld){
      // FINAL STRIDES — drone swings ahead of the leader, looking back:
      // they charge into the camera as they hit the wire
      const ahead=trackPos(ld.progress + 22/CIRC, 0);
      tp.set(ahead.x + 4, 5, ahead.z);
      ta.set(lf.x, 2, lf.z);
      camLabel.innerHTML='<span class="rec">●</span> DRONE — THE WIRE';
      targetFov=Math.max(26, Math.min(40, lf.spread*1.6)); sm=4.0;
    } else {
      // Glide alongside and slightly above the leaders
      tp.set(lf.x + 9 + lf.spread*0.5, 6 + lf.spread*0.3, lf.z - 9);
      ta.set(lf.x, 1.8, lf.z + 2);
      camLabel.innerHTML='<span class="rec">●</span> DRONE'; targetFov=44; sm=4.5;
    }

  } else if(mode==='wire'){
    // HOMESTRETCH CAM — single continuous shot like the NBC broadcast:
    // high camera near the finish, FIXED position, PANS with the pack.
    const hc=trackPos(-8/CIRC, TW/2+30);  // just past the line, high outside
    tp.set(hc.x, 26, hc.z);               // constant position — pan only
    const lf=leadersFrame();
    let ax=lf.x, az=lf.z, sprd=lf.spread;
    const earlyPass = raceFrac < 0.5;     // first trip down the stretch
    if(earlyPass){
      // Frame the WHOLE pack — aim at pack centre, radius covers every runner
      const pk=packXZ();
      ax=pk.x; az=pk.z;
      let r=4;
      deerObjs.forEach(d=>{ if(d && !d.finished){
        r=Math.max(r, Math.hypot(d.group.position.x-ax, d.group.position.z-az));
      }});
      sprd=r*2;
    } else if(dramaCloser && !dramaCloser.finished){
      // DRAMA: blend the aim toward the charging closer and widen the frame
      // so the come-from-behind run is always on screen.
      const cf=(dramaCloser.progress-P_GATE)/1.25;
      if(cf>0.78){
        const cp=dramaCloser.group.position;
        ax = ax*0.68 + cp.x*0.32;
        az = az*0.68 + cp.z*0.32;
        const ld0=leader();
        if(ld0) sprd = Math.max(sprd, Math.hypot(ld0.group.position.x-cp.x, ld0.group.position.z-cp.z)*1.1);
      }
    }
    ta.set(ax, 1.5, az);
    // REAL LENS OPTICS: FOV that exactly fits the subject at its distance —
    // long-lens tight when they're far up the stretch, widening automatically
    // as they bear down on the camera so nobody leaves the frame.
    const dx=ax-tp.x, dz=az-tp.z;
    const dist=Math.max(8, Math.hypot(dx,dz));
    // Final pass runs a much tighter margin — punched-in on the duel
    const halfW = earlyPass ? sprd*0.5 + 1.5 : sprd*0.42 + 2;
    targetFov=Math.max(14, Math.min(75, 2*Math.atan(halfW/dist)*180/Math.PI));
    camLabel.innerHTML='<span class="rec">●</span> HOMESTRETCH'; sm=5.0;

  } else if(mode==='infield'){
    const lf=leadersFrame();
    tp.set(lf.x * 0.3, 1.2, lf.z + 10 + lf.spread*0.4);
    ta.set(lf.x, 3, lf.z - 5);
    camLabel.innerHTML='<span class="rec">●</span> INFIELD'; sm=3.0;

  } else {
    // Fallback aerial — tracks the leaders, never a static empty shot
    const lf=leadersFrame();
    tp.set(lf.x + 30, 60, lf.z - 60);
    ta.set(lf.x, 0, lf.z);
    camLabel.innerHTML='<span class="rec">●</span> AERIAL'; targetFov=54; sm=1.2;
  }

  const a=1-Math.exp(-sm*dt);
  camPos.lerp(tp,a); camAim.lerp(ta,a);
  if(!isFinite(camPos.x)||!isFinite(camPos.y)||!isFinite(camPos.z)){ camPos.copy(tp); }
  if(!isFinite(camAim.x)||!isFinite(camAim.y)||!isFinite(camAim.z)){ camAim.copy(ta); }
  camera.position.copy(camPos);
  // Blimp looks nearly straight down — set up=(0,0,-1) so oval long axis = portrait vertical
  if(mode==='blimp'){
    // blimp already handled above with early return — nothing here
  } else {
    camera.up.set(0,1,0);
    camera.lookAt(camAim);
  }
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function showResults(){
  const order=[...deerObjs].filter(Boolean).sort((a,b)=>a.place-b.place);
  let rows=order.map(d=>`<div class="rrow">
    <span class="pos">${d.place}</span>
    <span class="swatch" style="background:${SILKS[NAMES.indexOf(d.name)]}"></span>
    <span class="nm">${d.name}${d.name==='Rudolph'?' 🔴':''}</span>
  </div>`).join('');
  if(grinch && grinch.place===1){
    rows=`<div class="rrow">
      <span class="pos">1</span>
      <span class="swatch" style="background:#2f9e44"></span>
      <span class="nm">The Grinch 💚</span>
    </div>`+rows;
  }
  const winnerName = raceWinner() ? raceWinner().name : order[0].name;
  // Photo finish strip — noses at the line
  const photos = photoFinish.map(p=>
    `<div style="text-align:center">
      <img src="${p.img}">
      <span style="font-size:.68rem;color:#f4c95d;font-weight:700">${p.place}${['st','nd','rd'][p.place-1]||'th'} ${p.name}</span>
    </div>`).join('');
  const photoBlock = photos ?
    `<div style="margin:.6rem 0 .2rem"><div style="font-size:.78rem;letter-spacing:.12em;color:#7884a8;margin-bottom:2px">📸 PHOTO FINISH</div><div class="pfRow">${photos}</div></div>` : '';
  overlay.innerHTML=`<div class="card"><div class="resultCard">
    <h2>🏆 ${winnerName} wins!</h2>${photoBlock}<div class="orderGrid">${rows}</div>
    <div class="credit">Model: "Deer Animation" by DarryleH · CC-BY-4.0 · sketchfab.com · ${VERSION}</div>
    <div style="margin-top:1.1rem">
      ${replayFrames.length>1?'<button class="bigBtn" id="replayBtn" style="display:block;margin-bottom:.7rem;background:linear-gradient(180deg,#7cc4f0,#3f8fc4);box-shadow:0 6px 0 #1d5a85">📺 Instant Replay</button>':''}
      <button class="bigBtn" id="again" style="display:block">Race Again</button>
    </div>
  </div></div>`;
  overlay.classList.remove('off');
  const rb=document.getElementById('replayBtn');
  if(rb) rb.addEventListener('click', startReplay);
  document.getElementById('again').addEventListener('click',()=>{
    overlay.innerHTML=`<div class="card">
      <h1>The <span class="g">Reindeer</span> Dash <small style="font-size:.45em;opacity:.7">v8.5</small></h1>
      <p class="sub">9 runners &middot; oval track &middot; ${VERSION}</p>
      <button class="bigBtn" id="s2" style="display:block;margin:1.5rem auto 0">Race Again</button>
    </div>`;
    overlay.classList.remove('off');
    document.getElementById('s2').addEventListener('click', beginRace);
  });
}

// ── NOSE CALIBRATION ─────────────────────────────────────────────────────────
let calActive=false, calRotY=0.3, calRotX=-0.1, calZoom=5;
let calDragging=false, calLastX=0, calLastY=0, calPinchDist=0;

function openCalibration(rud){
  calActive=true;
  document.getElementById('calOverlay').style.display='block';
  document.getElementById('overlay').style.display='none'; // hide title screen

  // Hide all deer except Rudolph, hide elves
  deerObjs.forEach((d,i)=>{
    if(!d) return;
    if(i!==8){ d.group.visible=false; if(d.elf) d.elf.visible=false; }
    else { d.group.visible=true; if(d.elf) d.elf.visible=false; } // hide elf during cal
  });

  // Centre Rudolph for viewing
  rud.group.position.set(0,0,0);
  rud.group.rotation.y=0;

  // Orbit via main renderer canvas
  const cvs=renderer.domElement;
  function onDown(e){ calDragging=true; calLastX=e.clientX; calLastY=e.clientY; }
  function onMove(e){
    if(!calDragging) return;
    calRotY+=(e.clientX-calLastX)*0.008;
    calRotX+=(e.clientY-calLastY)*0.005;
    calRotX=Math.max(-1.2,Math.min(1.2,calRotX));
    calLastX=e.clientX; calLastY=e.clientY;
  }
  function onUp(){ calDragging=false; }
  function onWheel(e){ calZoom=Math.max(1.5,Math.min(12,calZoom+e.deltaY*.01)); }
  function onTStart(e){ if(e.touches.length===2)
    calPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
  function onTMove(e){ if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    calZoom=Math.max(1.5,Math.min(12,calZoom-(d-calPinchDist)*0.02)); calPinchDist=d; } }

  cvs.addEventListener('pointerdown',onDown);
  cvs.addEventListener('pointermove',onMove);
  cvs.addEventListener('pointerup',onUp);
  cvs.addEventListener('wheel',onWheel,{passive:true});
  cvs.addEventListener('touchstart',onTStart,{passive:true});
  cvs.addEventListener('touchmove',onTMove,{passive:true});

  // Done button
  document.querySelector('#calOverlay button').addEventListener('click',()=>{
    calActive=false;
    document.getElementById('calOverlay').style.display='none';
    document.getElementById('overlay').style.display='flex'; // restore title screen
    // Restore all deer
    deerObjs.forEach(d=>{ if(!d) return; d.group.visible=true; if(d.elf) d.elf.visible=true; });
    cvs.removeEventListener('pointerdown',onDown);
    cvs.removeEventListener('pointermove',onMove);
    cvs.removeEventListener('pointerup',onUp);
    cvs.removeEventListener('wheel',onWheel);
    cvs.removeEventListener('touchstart',onTStart);
    cvs.removeEventListener('touchmove',onTMove);
  },{once:true});
}

function updateCalCamera(){
  if(!calActive) return;
  camera.position.set(
    Math.sin(calRotY)*Math.cos(calRotX)*calZoom,
    Math.sin(calRotX)*calZoom+2.0,
    Math.cos(calRotY)*Math.cos(calRotX)*calZoom
  );
  camera.lookAt(0, 2.0, 0);
  // Update nose position from analytically computed offset
  const rud=deerObjs[8];
  if(rud&&rud.noseGroup&&rud.headNode){
    const wp=new THREE.Vector3(), wq=new THREE.Quaternion();
    rud.headNode.getWorldPosition(wp); rud.headNode.getWorldQuaternion(wq);
    const off=new THREE.Vector3(noseOff.x,noseOff.y,noseOff.z);
    off.applyQuaternion(wq);
    rud.noseGroup.position.copy(wp).add(off);
  }
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const rawDt=Math.min(0.05, clock.getDelta());
  const dt=rawDt*(racing?speedMult:1);   // 2× applies to the live race only
  pauseBtn.style.display = racing ? 'block' : 'none';
  speedBtn.style.display = racing ? 'block' : 'none';
  updateSparkles(rawDt);
  updateSnow(rawDt);
  if(replayActive){ updateReplay(rawDt); renderer.render(scene, camera); return; }
  if(paused && racing){ renderer.render(scene, camera); return; }
  if(racing) updateRace(dt);
  else if(preRace){
    // Gate lineup — idle animation plays, elves stay seated, tags track
    deerObjs.forEach(d=>{ if(d){ d.mixer.timeScale=1; d.mixer.update(dt); } });
    trackAttachments();
  }
  updateGateDoors(dt);
  if(calActive) updateCalCamera(); else directCamera(dt);
  renderer.render(scene, camera);
}

init();
})();
</script>
