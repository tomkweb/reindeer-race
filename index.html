<script>
window.onerror=function(msg,src,line){

(function(){
const VERSION='v3.5';
const NAMES=['Dasher','Dancer','Prancer','Vixen','Comet','Cupid','Donner','Blitzen','Rudolph'];
const COLORS=['#c47a3a','#b86d45','#d49050','#a05c2e','#c88048','#b07040','#d4a060','#985030','#e03020'];
const ELF_COLORS=['#c62828','#2e7d32','#c62828','#2e7d32','#c62828','#2e7d32','#c62828','#2e7d32','#1976d2'];
const N=9, LANE_W=1.6, BASE_SPEED=3.0;

// ── OVAL TRACK GEOMETRY (analytical – no Three.js curve dependency) ──────────
// Layout: homestretch on right (X=+R), backstretch on left (X=-R)
// Horses run counterclockwise viewed from above.
const STR  = 80;                        // straight length (m)
const TR   = 30;                        // turn radius (m)
const CIRC = 2*STR + 2*Math.PI*TR;     // full lap ~349 m
const TW   = 14;                        // track width (m)

// Segment arc-length boundaries
const S1 = STR;                         // end of homestretch
const S2 = STR + Math.PI*TR;           // end of top turn
const S3 = 2*STR + Math.PI*TR;         // end of backstretch
const S4 = CIRC;                        // end of bottom turn

/**
 * Returns {x, z, ry} for a deer at fractional lap progress p (0..1)
 * with laneOff metres to the right of the centreline.
 */
function trackPos(p, laneOff){
  const u  = ((p % 1) + 1) % 1;
  const d  = u * CIRC;   // distance along track (m)
  let px, pz, tx, tz;    // centre-line position & unit tangent

  if(d < S1){
    // Homestretch: X = +TR, Z increases 0 → STR
    const t = d / STR;
    px = TR;  pz = t * STR;
    tx = 0;   tz = 1;

  } else if(d < S2){
    // Top turn: semicircle centred at (0, 0, STR), angle 0 → π
    const a = (d - S1) / (Math.PI * TR);   // 0..1
    const ang = a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = STR + Math.sin(ang) * TR;
    tx = -Math.sin(ang);   // tangent dx/d(ang) (normalised)
    tz =  Math.cos(ang);

  } else if(d < S3){
    // Backstretch: X = -TR, Z decreases STR → 0
    const t = (d - S2) / STR;
    px = -TR;  pz = STR - t * STR;
    tx = 0;    tz = -1;

  } else {
    // Bottom turn: semicircle centred at (0, 0, 0), angle π → 2π
    const a = (d - S3) / (Math.PI * TR);   // 0..1
    const ang = Math.PI + a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = Math.sin(ang) * TR;
    tx = -Math.sin(ang);
    tz =  Math.cos(ang);
  }

  // Right normal = (tz, 0, -tx)  →  positive laneOff moves outward
  return {
    x  : px + tz * laneOff,
    z  : pz - tx * laneOff,
    ry : Math.atan2(tx, tz)   // deer faces direction of travel
  };
}

// Rudolph nose offset (tune with calibration panel)
let noseOff = {x:0, y:-0.20, z:0.50};

const TC_X = 0, TC_Z = STR / 2;

// ── ENGINE GLOBALS ────────────────────────────────────────────────────────────
let scene, camera, renderer, clock;
let deerObjs=new Array(N).fill(null), deerLoaded=0, deerScale=1, autoScaleDone=false;
let racing=false, raceTime=0, finishCounter=0, finishedAll=false, postTimer=0;
let camMode='auto', autoPick='wide', autoCutTimer=0;
let snowGeo;
const camPos = new THREE.Vector3(TC_X, 55, TC_Z - 60);
const camAim = new THREE.Vector3(TC_X, 0,  TC_Z);

const overlay   = document.getElementById('overlay');
const loadBar   = document.getElementById('loadBar');
const loadMsg   = document.getElementById('loadMsg');
const startBtn  = document.getElementById('startBtn');
const camLabel  = document.getElementById('camLabel');
const leaderEl  = document.getElementById('leader');
const timerEl   = document.getElementById('timer');

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x8aadd4);
  scene.fog = new THREE.Fog(0x8aadd4, 60, 280);

  camera = new THREE.PerspectiveCamera(54, innerWidth/innerHeight, 0.1, 600);
  camera.position.copy(camPos);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding  = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type  = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xd4eaff, 0x6a7a90, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d6, 1.3);
  sun.position.set(-55, 65, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -110; sun.shadow.camera.right  = 110;
  sun.shadow.camera.top  =  110; sun.shadow.camera.bottom = -110;
  sun.shadow.camera.near = 1;    sun.shadow.camera.far    = 300;
  scene.add(sun);

  buildGround();
  buildScenery();
  buildSnow();
  loadAllDeer();        // ← start loading models immediately
  buildOvalTrack();     // ← build track geometry after

  document.querySelectorAll('.camBar button').forEach(b=>b.addEventListener('click',()=>{
    camMode = b.dataset.cam;
    document.querySelectorAll('.camBar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }));
  startBtn.addEventListener('click', beginRace);

  // Nose calibration panel — wires sliders to noseOff and updates display
  function wireCalSliders(){
    [['cX','x'],['cY','y'],['cZ','z']].forEach(([id,axis])=>{
      const sl=document.getElementById(id);
      const vl=document.getElementById(id.replace('c','c')+'v'); // cXv etc
      sl.addEventListener('input',e=>{
        const v=parseFloat(e.target.value);
        noseOff[axis]=v;
        document.getElementById(id+'v').textContent=v.toFixed(2);
        document.getElementById('cOut'+id[1].toUpperCase()).textContent=v.toFixed(2);
      });
    });
  }
  wireCalSliders();

  // Calibration button — opens dedicated Rudolph-only scene
  document.getElementById('calBtn').addEventListener('click',()=>{
    const rud=deerObjs[8];
    if(!rud){ alert('Still loading — try again in a moment.'); return; }
    openCalibration(rud);
  });
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
}

// ── GROUND ────────────────────────────────────────────────────────────────────
function buildGround(){
  const g = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 600),
    new THREE.MeshStandardMaterial({color: 0xddeeff, roughness: 0.95})
  );
  g.rotation.x = -Math.PI/2;
  g.receiveShadow = true;
  scene.add(g);
}

// ── OVAL TRACK VISUAL ─────────────────────────────────────────────────────────
function buildOvalTrack(){
  const railMat  = new THREE.MeshStandardMaterial({color:0xfafcff,roughness:.6});
  const postMat  = new THREE.MeshStandardMaterial({color:0xcc3344});
  const bannerMat= new THREE.MeshStandardMaterial({color:0x155724});
  const hw = TW/2 + 1.5;
  const nPosts = 60;

  // Fence posts + horizontal rail bars around inner and outer edges
  for(let i=0;i<nPosts;i++){
    const u0=i/nPosts, u1=(i+1)/nPosts;
    [- hw, hw].forEach(off=>{
      const a=trackPos(u0,off), b=trackPos(u1,off);
      // Post
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,1.3,7),postMat);
      post.position.set(a.x,.65,a.z);
      scene.add(post);
      // Rail bar connecting this post to the next
      const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
      const dx=b.x-a.x, dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz);
      const rail=new THREE.Mesh(new THREE.BoxGeometry(len,.12,.22),railMat);
      rail.position.set(mx,.95,mz);
      rail.rotation.y=-Math.atan2(dz,dx);
      scene.add(rail);
    });
  }

  // Finish line gantry at progress=0
  const fp=trackPos(0,0);
  const fi=trackPos(0,-hw-1), fo=trackPos(0,hw+1);
  [fi,fo].forEach(sp=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,9,10),postMat);
    pole.position.set(sp.x,4.5,sp.z); scene.add(pole);
  });
  const ban=new THREE.Mesh(new THREE.BoxGeometry(TW+4,2,.25),bannerMat);
  ban.position.set(fp.x,8.5,fp.z);
  ban.rotation.y=fp.ry-Math.PI/2;
  scene.add(ban);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(TW+4,.04,1.0),
    new THREE.MeshStandardMaterial({color:0x111111}));
  stripe.rotation.y=fp.ry-Math.PI/2;
  stripe.position.set(fp.x,.03,fp.z);
  scene.add(stripe);
}

// ── SCENERY ───────────────────────────────────────────────────────────────────
function makeTree(x, z, s){
  const g = new THREE.Group();
  const tM = new THREE.MeshStandardMaterial({color:0x5a3a22,roughness:.9});
  const fM = new THREE.MeshStandardMaterial({color:0x2a6840,roughness:.85});
  const cM = new THREE.MeshStandardMaterial({color:0xddeeff,roughness:.7});
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.3*s,1.5*s,7),tM);
  tr.position.y=.75*s; tr.castShadow=true; g.add(tr);
  for(let i=0;i<3;i++){
    const cone = new THREE.Mesh(new THREE.ConeGeometry((2-i*.45)*s,(2.2-i*.25)*s,9),fM);
    cone.position.y=(1.9+i*1.45)*s; cone.castShadow=true; g.add(cone);
    const cap = new THREE.Mesh(new THREE.ConeGeometry((2.05-i*.45)*s,.45*s,9),cM);
    cap.position.y=(2.7+i*1.45)*s; g.add(cap);
  }
  g.position.set(x,0,z);
  return g;
}
function buildScenery(){
  const outerR = TR + TW/2 + 5;
  for(let i=0;i<50;i++){
    const ang = Math.random()*Math.PI*2;
    const r   = outerR + 8 + Math.random()*55;
    // Stretch the ellipse to match the oval shape
    const x   = Math.cos(ang) * r;
    const z   = TC_Z + Math.sin(ang) * r * 1.6;
    scene.add(makeTree(x, z, 0.7+Math.random()*1.5));
  }
  for(let i=0;i<10;i++){
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(35+Math.random()*30, 40+Math.random()*40, 5),
      new THREE.MeshStandardMaterial({color:0xb0c4de,roughness:1})
    );
    m.position.set(
      (Math.random()-.5)*500,
      0,
      TC_Z + (160+Math.random()*80)*(Math.random()<.5?1:-1)
    );
    scene.add(m);
  }
}

// ── SNOW ──────────────────────────────────────────────────────────────────────
function buildSnow(){
  snowGeo = new THREE.BufferGeometry();
  const cnt=700, arr=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){
    arr[i*3]   = (Math.random()-.5)*200;
    arr[i*3+1] = Math.random()*65;
    arr[i*3+2] = TC_Z + (Math.random()-.5)*220;
  }
  snowGeo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(snowGeo,
    new THREE.PointsMaterial({color:0xffffff,size:.5,transparent:true,opacity:.8,depthWrite:false})));
}

// ── ELF JOCKEY ────────────────────────────────────────────────────────────────
function makeElf(coatColor){
  const g = new THREE.Group();
  const skin =new THREE.MeshStandardMaterial({color:0xf3c894,roughness:.7});
  const coat =new THREE.MeshStandardMaterial({color:coatColor,roughness:.7});
  const pants=new THREE.MeshStandardMaterial({color:0x2a4d3a,roughness:.7});
  const boot =new THREE.MeshStandardMaterial({color:0x2a1a0a,roughness:.8});
  const gold =new THREE.MeshStandardMaterial({color:0xd9a233,roughness:.4,metalness:.4});
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6});
  const dark =new THREE.MeshStandardMaterial({color:0x111111});
  // Torso + belt
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.16,.20,.4,10),coat);
  body.castShadow=true; g.add(body);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,12),boot);
  belt.position.y=-.18; g.add(belt);
  const buckle=new THREE.Mesh(new THREE.BoxGeometry(.07,.05,.01),gold);
  buckle.position.set(0,-.18,.18); g.add(buckle);
  // Head + face
  const head=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),skin);
  head.position.y=.32; head.castShadow=true; g.add(head);
  [-0.045,0.045].forEach(x=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(.018,6,6),dark);
    e.position.set(x,.34,.115); g.add(e);
  });
  const noseMesh=new THREE.Mesh(new THREE.SphereGeometry(.022,6,6),skin);
  noseMesh.position.set(0,.31,.125);
  g.add(noseMesh);
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.035,.12,5),skin);
    ear.position.set(s*.13,.34,-.01); ear.rotation.z=s*Math.PI/2.2; g.add(ear);
  });
  // Hat
  const hat=new THREE.Mesh(new THREE.ConeGeometry(.15,.4,12),coat);
  hat.position.y=.65; hat.rotation.x=-.18; hat.castShadow=true; g.add(hat);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.05,12),white);
  band.position.y=.47; g.add(band);
  const pom=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),white);
  pom.position.set(.06,.86,.06); g.add(pom);
  // Arms
  [-1,1].forEach(s=>{
    const pv=new THREE.Group();
    pv.position.set(s*.18,.05,0);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.32,6),coat);
    arm.position.y=-.16; arm.castShadow=true; pv.add(arm);
    pv.rotation.x=-.95; g.add(pv);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),skin);
    hand.position.set(s*.16,-.05,.28); g.add(hand);
  });
  // Legs
  [-1,1].forEach(s=>{
    const lp=new THREE.Group();
    lp.position.set(s*.12,-.22,0);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.055,.05,.35,7),pants);
    leg.position.y=-.175; leg.castShadow=true; lp.add(leg);
    lp.rotation.z=s*.45; g.add(lp);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.06,.14),boot);
    b.position.set(s*.30,-.55,.02); g.add(b);
  });
  return g;
}

// ── LOAD DEER ─────────────────────────────────────────────────────────────────
function normalizeClip(clip){
  let minT=Infinity;
  clip.tracks.forEach(tr=>{if(tr.times.length) minT=Math.min(minT,tr.times[0]);});
  if(minT>0) clip.tracks.forEach(tr=>{for(let i=0;i<tr.times.length;i++) tr.times[i]-=minT;});
  clip.resetDuration();
  return clip;
}
function loadAllDeer(){
  if(!THREE.GLTFLoader){
    loadMsg.textContent='ERROR: 3D loader not available.';
    loadMsg.style.color='#ff8888'; return;
  }
  const loader=new THREE.GLTFLoader();
  setTimeout(()=>{if(deerLoaded===0){
    loadMsg.textContent='Network error — try refreshing.';
    loadMsg.style.color='#ff8888';
  }},20000);
  // Load 9 times with unique query strings to bypass Three.js request deduplication
  for(let i=0;i<N;i++){
    (function(idx){
      loader.load(
        'https://raw.githubusercontent.com/tomkweb/reindeer-race/main/scene.gltf?n='+idx,
        gltf=>setupDeer(gltf.scene,
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'Rundeer')),
          normalizeClip(THREE.AnimationClip.findByName(gltf.animations,'IdleDeer')),
          idx),
        null,
        err=>{loadMsg.textContent='Load failed ('+idx+'): '+(err.message||err);loadMsg.style.color='#ff8888';}
      );
    })(i);
  }
}
function setupDeer(deerScene, runClip, idleClip, idx){
  deerScene.scale.setScalar(deerScale);

  // Colour tint
  const tint=new THREE.Color(COLORS[idx]);
  deerScene.traverse(n=>{
    if(!n.isMesh) return;
    const orig=Array.isArray(n.material)?n.material[0]:n.material;
    const mat=orig.clone();
    if(mat.color.r+mat.color.g+mat.color.b>0.25) mat.color.multiply(tint);
    mat.roughness=0.75; mat.metalness=0.0;
    n.material=mat; n.castShadow=true; n.receiveShadow=true;
  });

  // Rudolph's nose
  let headNode=null, noseGroup=null;
  if(idx===8){
    const nm=new THREE.MeshStandardMaterial(
      {color:0xff2233,emissive:0xff1122,emissiveIntensity:2.5,roughness:.2});
    noseGroup=new THREE.Group();
    noseGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.28,14,14),nm));
    scene.add(noseGroup);
    deerScene.traverse(nd=>{
      if(!headNode&&nd.name&&nd.name.toLowerCase().includes('head')) headNode=nd;
    });
  }

  // Spine bone for elf seat
  let backBone=null;
  deerScene.traverse(nd=>{
    if(!backBone&&nd.name&&/back_0\d+$/i.test(nd.name)) backBone=nd;
  });

  // Elf
  const elf=makeElf(ELF_COLORS[idx]);
  elf.scale.setScalar(2.2);
  scene.add(elf);

  // Animation mixer per deer (clips are shared, mixers are per-instance)
  const mixer  =new THREE.AnimationMixer(deerScene);
  const action =mixer.clipAction(runClip);
  const idleAct=mixer.clipAction(idleClip);
  action.setLoop(THREE.LoopRepeat,Infinity);
  action.play(); action.paused=true;
  idleAct.play(); idleAct.paused=true;

  const laneOff=(idx-(N-1)/2)*LANE_W;
  const sp=trackPos(0,laneOff);
  deerScene.position.set(sp.x,0,sp.z);
  deerScene.rotation.y=sp.ry;
  scene.add(deerScene);

  deerObjs[idx]={
    group:deerScene, mixer, action, idleAct,
    noseGroup, headNode, elf, backBone,
    laneOff, progress:0, speed:0,
    base:0, surgeF:0, surgeP:0, amp:0,
    flightProg:-1, flightDur:0, flightAlt:0, nextFlight:0,
    place:0, finished:false, name:NAMES[idx]
  };

  deerLoaded++;
  loadBar.style.width=(deerLoaded/N*100)+'%';
  loadMsg.textContent='Cloning deer… '+deerLoaded+'/9';
  if(deerLoaded===N){ loadMsg.textContent='Ready!'; startBtn.style.display='block'; document.getElementById('calBtn').style.display='block'; }
}


// ── RACE SETUP ────────────────────────────────────────────────────────────────
function configureRace(){
  raceTime=0; finishCounter=0; finishedAll=false; postTimer=0;
  deerObjs.forEach(d=>{
    if(!d) return;
    d.progress=0; d.place=0; d.finished=false;
    d.flightProg=-1; d.nextFlight=2.5+Math.random()*4;
    d.base   = 10 + Math.random()*5;
    d.surgeF = 0.45 + Math.random()*1.3;
    d.surgeP = Math.random()*Math.PI*2;
    d.amp    = 0.20 + Math.random()*0.35;
    d.speed  = d.base;
    const sp=trackPos(0, d.laneOff);
    d.group.position.set(sp.x, 0, sp.z);
    d.group.rotation.y=sp.ry;
    d.idleAct.stop();
    d.action.reset().play(); d.action.paused=false;
    d.mixer.setTime(Math.random()*2);
  });
}
function beginRace(){
  configureRace();
  showCountdown(()=>{ racing=true; overlay.classList.add('off'); });
}
function showCountdown(done){
  overlay.classList.remove('off');
  overlay.innerHTML='<div class="card"><div class="count" id="cnum">3</div></div>';
  let cnt=document.getElementById('cnum');
  const seq=['3','2','1','GO!']; let i=0;
  (function step(){
    if(i<seq.length){
      cnt.textContent=seq[i];
      cnt.style.animation='none'; void cnt.offsetWidth; cnt.style.animation='pop .85s ease';
      i++; setTimeout(step,750);
    } else { done(); }
  })();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function leader(){ let b=null; deerObjs.forEach(d=>{ if(d&&(!b||d.progress>b.progress)) b=d; }); return b; }
function packXZ(){ let x=0,z=0,n=0; deerObjs.forEach(d=>{ if(d){x+=d.group.position.x;z+=d.group.position.z;n++;} }); return{x:x/(n||1),z:z/(n||1)}; }

// ── UPDATE RACE ───────────────────────────────────────────────────────────────
function updateRace(dt){
  raceTime+=dt;
  deerObjs.forEach(d=>{
    if(!d) return;
    if(d.finished){
      d.group.position.y=0;
      d.mixer.timeScale=0.7; d.mixer.update(dt);
      return;
    }
    // Speed
    d.speed=Math.max(2, d.base*(1+d.amp*Math.sin(d.surgeF*raceTime+d.surgeP))*(0.92+Math.random()*.16));
    d.progress += d.speed*dt/CIRC;

    // Fly
    if(d.flightProg<0){
      if(raceTime>=d.nextFlight){
        d.flightProg=0; d.flightDur=1.4+Math.random()*2; d.flightAlt=2+Math.random()*5;
      }
      d.group.position.y=0;
    } else {
      d.flightProg+=dt/d.flightDur;
      if(d.flightProg>=1){ d.flightProg=-1; d.group.position.y=0; d.nextFlight=raceTime+1.5+Math.random()*4; }
      else { d.group.position.y=Math.sin(d.flightProg*Math.PI)*d.flightAlt; }
    }

    // Position on oval
    const sp=trackPos(d.progress, d.laneOff);
    d.group.position.x=sp.x;
    d.group.position.z=sp.z;
    d.group.rotation.y=sp.ry;
    d.mixer.timeScale=1.5; d.mixer.update(dt);

    // Finish
    if(d.progress>=1.0){
      d.finished=true; d.place=++finishCounter;
      d.group.position.y=0; d.flightProg=-1;
      const fp=trackPos(1.0, d.laneOff);
      d.group.position.x=fp.x; d.group.position.z=fp.z; d.group.rotation.y=fp.ry;
      d.idleAct.reset().play(); d.action.crossFadeTo(d.idleAct,.4,false);
    }
  });

  // Rudolph nose
  const rud=deerObjs[8];
  if(rud&&rud.noseGroup){
    if(rud.headNode){
      const wp=new THREE.Vector3(), wq=new THREE.Quaternion();
      rud.headNode.getWorldPosition(wp); rud.headNode.getWorldQuaternion(wq);
      const off=new THREE.Vector3(noseOff.x, noseOff.y, noseOff.z); off.applyQuaternion(wq);
      rud.noseGroup.position.copy(wp).add(off);
    } else {
      rud.noseGroup.position.set(rud.group.position.x, rud.group.position.y+3.4, rud.group.position.z);
    }
  }

  // Elf jockeys
  const _v=new THREE.Vector3();
  deerObjs.forEach(d=>{
    if(!d||!d.elf) return;
    if(d.backBone){ d.backBone.getWorldPosition(_v); d.elf.position.copy(_v); d.elf.position.y+=0.9; }
    else { d.elf.position.set(d.group.position.x, d.group.position.y+2.8, d.group.position.z); }
    d.elf.rotation.y=d.group.rotation.y;
  });

  // HUD
  const ld=leader();
  if(ld) leaderEl.innerHTML=finishCounter>0
    ?'LEADER <b>'+(deerObjs.find(x=>x&&x.place===1)||ld).name.toUpperCase()+'</b>'
    :'LEADER <b>'+ld.name.toUpperCase()+'</b>';
  timerEl.textContent=raceTime.toFixed(1)+'s';

  if(finishCounter>=N&&!finishedAll) finishedAll=true;
  if(finishedAll){ postTimer+=dt; if(postTimer>2) { racing=false; showResults(); } }
}

// ── CAMERA DIRECTOR ───────────────────────────────────────────────────────────
function directCamera(dt){
  let mode=camMode;
  if(mode==='auto'){
    const ld=leader();
    const prog=ld?ld.progress:0;
    if(raceTime<3.5){
      autoPick='wide';
    } else if(prog<0.12){
      autoPick='aerial';
    } else if(prog<0.72){
      autoCutTimer-=dt;
      if(autoCutTimer<=0){
        const pool=['aerial','chase','rail','infield','turn','aerial','chase','aerial','turn'];
        let pick; do{ pick=pool[Math.floor(Math.random()*pool.length)]; }while(pick===autoPick);
        autoPick=pick; autoCutTimer=3+Math.random()*2;
      }
    } else if(prog<0.88){
      if(autoPick!=='headon'){ autoPick='headon'; autoCutTimer=999; }
    } else {
      autoCutTimer-=dt;
      if(autoCutTimer<=0){ autoPick=autoPick==='finish'?'headon':'finish'; autoCutTimer=1.2+Math.random()*.8; }
    }
    mode=autoPick;
  }

  const ld=leader(), pc=packXZ();
  const prog=ld?ld.progress:0;
  let tp=new THREE.Vector3(), ta=new THREE.Vector3(), sm=2.2;

  if(mode==='wide'){
    // Establishing shot — high and back, full oval visible
    tp.set(TC_X, 62, TC_Z-65); ta.set(TC_X, 0, TC_Z);
    camLabel.innerHTML='<span class="rec">●</span> WIDE — FULL OVAL'; sm=1.2;

  } else if(mode==='aerial'){
    const h=42-prog*24;
    tp.set(pc.x*.2, Math.max(14,h), pc.z-32); ta.set(pc.x*.2, 1.5, pc.z+20);
    camLabel.innerHTML='<span class="rec">●</span> AERIAL';

  } else if(mode==='chase'){
    if(ld){
      const back=trackPos(ld.progress-0.03, ld.laneOff*.5);
      tp.set(back.x, 5.0, back.z);
      ta.set(ld.group.position.x, 2.5, ld.group.position.z);
    }
    camLabel.innerHTML='<span class="rec">●</span> CHASE — '+(ld?ld.name.toUpperCase():''); sm=2.5;

  } else if(mode==='rail'){
    // Trackside eye-level, pack sweeps past
    const sp=trackPos((prog-.05+1)%1, -(TW/2+12));
    tp.set(sp.x, 3.5, sp.z); ta.set(pc.x, 2.0, pc.z);
    camLabel.innerHTML='<span class="rec">●</span> RAIL CAM'; sm=3.5;

  } else if(mode==='turn'){
    // Inside the turn apex looking at horses sweeping around — classic oval shot
    const inTop=prog>0.15&&prog<0.50;
    const cz=inTop?STR:0;
    tp.set(TC_X, 4, cz); ta.set(pc.x, 2.0, pc.z);
    camLabel.innerHTML='<span class="rec">●</span> TURN CAM'; sm=2.0;

  } else if(mode==='infield'){
    // Low inside the oval, horses thunder past
    tp.set(pc.x*.2, 0.9, pc.z+7); ta.set(pc.x*.2+5, 2.5, pc.z-8);
    camLabel.innerHTML='<span class="rec">●</span> INFIELD'; sm=3.5;

  } else if(mode==='headon'){
    // Ahead of leader, looking back — pack charges the camera
    if(ld){
      const ahead=trackPos(ld.progress+0.08, 0);
      tp.set(ahead.x, 3.2, ahead.z); ta.set(pc.x, 2.0, pc.z);
    }
    camLabel.innerHTML='<span class="rec">●</span> HEAD-ON'; sm=1.8;

  } else {
    // Finish line — side-on tight
    const fp=trackPos(0,0);
    const fside=trackPos(0, TW/2+10);
    tp.set(fside.x, 3.5, fside.z); ta.set(fp.x, 2.0, fp.z);
    camLabel.innerHTML='<span class="rec">●</span> FINISH LINE'; sm=4.0;
  }

  const a=1-Math.exp(-sm*dt);
  camPos.lerp(tp,a); camAim.lerp(ta,a);
  camera.position.copy(camPos); camera.lookAt(camAim);
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function showResults(){
  const order=[...deerObjs].filter(Boolean).sort((a,b)=>a.place-b.place);
  const rows=order.map(d=>`<div class="rrow">
    <span class="pos">${d.place}</span>
    <span class="swatch" style="background:${COLORS[NAMES.indexOf(d.name)]}"></span>
    <span class="nm">${d.name}${d.name==='Rudolph'?' 🔴':''}</span>
  </div>`).join('');
  overlay.innerHTML=`<div class="card"><div class="resultCard">
    <h2>🏆 ${order[0].name} wins!</h2>${rows}
    <div class="credit">Model: "Deer Animation" by DarryleH · CC-BY-4.0 · sketchfab.com · ${VERSION}</div>
    <div style="margin-top:1.1rem">
      <button class="bigBtn" id="again" style="display:block">Race Again</button>
    </div>
  </div></div>`;
  overlay.classList.remove('off');
  document.getElementById('again').addEventListener('click',()=>{
    overlay.innerHTML=`<div class="card">
      <h1>The <span class="g">Reindeer</span> Dash <small style="font-size:.45em;opacity:.7">v3.1</small></h1>
      <p class="sub">9 runners &middot; oval track &middot; ${VERSION}</p>
      <button class="bigBtn" id="s2" style="display:block;margin:1.5rem auto 0">Race Again</button>
    </div>`;
    overlay.classList.remove('off');
    document.getElementById('s2').addEventListener('click', beginRace);
  });
}

// ── NOSE CALIBRATION ─────────────────────────────────────────────────────────
let calActive=false, calRotY=0.3, calRotX=-0.1, calZoom=5;
let calDragging=false, calLastX=0, calLastY=0, calPinchDist=0;

function openCalibration(rud){
  calActive=true;
  document.getElementById('calOverlay').style.display='block';
  document.getElementById('overlay').style.display='none'; // hide title screen

  // Hide all deer except Rudolph, hide elves
  deerObjs.forEach((d,i)=>{
    if(!d) return;
    if(i!==8){ d.group.visible=false; if(d.elf) d.elf.visible=false; }
    else { d.group.visible=true; if(d.elf) d.elf.visible=false; } // hide elf during cal
  });

  // Centre Rudolph for viewing
  rud.group.position.set(0,0,0);
  rud.group.rotation.y=0;

  // Orbit via main renderer canvas
  const cvs=renderer.domElement;
  function onDown(e){ calDragging=true; calLastX=e.clientX; calLastY=e.clientY; }
  function onMove(e){
    if(!calDragging) return;
    calRotY+=(e.clientX-calLastX)*0.008;
    calRotX+=(e.clientY-calLastY)*0.005;
    calRotX=Math.max(-1.2,Math.min(1.2,calRotX));
    calLastX=e.clientX; calLastY=e.clientY;
  }
  function onUp(){ calDragging=false; }
  function onWheel(e){ calZoom=Math.max(1.5,Math.min(12,calZoom+e.deltaY*.01)); }
  function onTStart(e){ if(e.touches.length===2)
    calPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
  function onTMove(e){ if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    calZoom=Math.max(1.5,Math.min(12,calZoom-(d-calPinchDist)*0.02)); calPinchDist=d; } }

  cvs.addEventListener('pointerdown',onDown);
  cvs.addEventListener('pointermove',onMove);
  cvs.addEventListener('pointerup',onUp);
  cvs.addEventListener('wheel',onWheel,{passive:true});
  cvs.addEventListener('touchstart',onTStart,{passive:true});
  cvs.addEventListener('touchmove',onTMove,{passive:true});

  // Done button
  document.querySelector('#calOverlay button').addEventListener('click',()=>{
    calActive=false;
    document.getElementById('calOverlay').style.display='none';
    document.getElementById('overlay').style.display='flex'; // restore title screen
    // Restore all deer
    deerObjs.forEach(d=>{ if(!d) return; d.group.visible=true; if(d.elf) d.elf.visible=true; });
    cvs.removeEventListener('pointerdown',onDown);
    cvs.removeEventListener('pointermove',onMove);
    cvs.removeEventListener('pointerup',onUp);
    cvs.removeEventListener('wheel',onWheel);
    cvs.removeEventListener('touchstart',onTStart);
    cvs.removeEventListener('touchmove',onTMove);
  },{once:true});
}

function updateCalCamera(){
  if(!calActive) return;
  camera.position.set(
    Math.sin(calRotY)*Math.cos(calRotX)*calZoom,
    Math.sin(calRotX)*calZoom+2.0,
    Math.cos(calRotY)*Math.cos(calRotX)*calZoom
  );
  camera.lookAt(0, 2.0, 0);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05, clock.getDelta());
  const sp=snowGeo.attributes.position;
  for(let i=0;i<sp.count;i++){ let y=sp.getY(i)-11*dt; if(y<0)y=65; sp.setY(i,y); }
  sp.needsUpdate=true;
  if(racing) updateRace(dt);
  if(calActive) updateCalCamera(); else directCamera(dt);
  renderer.render(scene, camera);
}

init();
})();
</script>
