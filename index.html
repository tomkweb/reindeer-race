<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0d1530;font-family:'Fredoka',system-ui,sans-serif;}
canvas{display:block;}
.hud{position:fixed;pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);z-index:5;}
#camLabel{top:16px;left:18px;font-family:'Luckiest Guy',cursive;font-size:clamp(.9rem,1.8vw,1.4rem);letter-spacing:.04em;color:#f4c95d;}
#camLabel .rec{color:#e23b4e;}
#leader{top:16px;right:18px;text-align:right;font-size:clamp(.85rem,1.5vw,1.2rem);font-weight:600;}

#timer{top:44px;right:18px;text-align:right;font-size:clamp(.7rem,1.2vw,1rem);color:#c6d2ec;font-variant-numeric:tabular-nums;}
#pauseBtn{position:fixed;top:40px;right:76px;z-index:6;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(20,26,44,.55);color:#c6d2ec;

.camBar button.active{background:#f4c95d;color:#1a1340;border-color:#f4c95d;}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(13,21,48,.55),rgba(13,21,48,.90));backdrop-filter:blur(4px);}
.overlay.off{display:none;}
.card{text-align:center;color:#fff;}
.card h1{font-family:'Luckiest Guy',cursive;font-size:clamp(2rem,5.5vw,4rem);line-height:1;
  text-shadow:0 3px 0 #e23b4e,0 0 30px rgba(127,168,255,.45);}
.card h1 .g{color:#f4c95d;text-shadow:0 0 22px rgba(244,201,93,.8);}
.card .sub{color:#c6d2ec;letter-spacing:.2em;text-transform:uppercase;
  font-size:clamp(.65rem,1.1vw,.9rem);margin:.6rem 0 .4rem;}
.progress{width:220px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;
  margin:.8rem auto 1.4rem;overflow:hidden;}
.progress .bar{height:100%;background:#f4c95d;border-radius:4px;transition:width .3s ease;width:0%;}
.count{font-family:'Luckiest Guy',cursive;font-size:clamp(5rem,16vw,12rem);color:#f4c95d;
  text-shadow:0 0 40px rgba(244,201,93,.7),0 5px 0 #e23b4e;animation:pop .85s ease;}
@keyframes pop{0%{transform:scale(.25);opacity:0;}40%{transform:scale(1.18);}100%{transform:scale(1);opacity:1;}}
.bigBtn{font-family:'Luckiest Guy',cursive;cursor:pointer;border:none;color:#2a1209;
  background:linear-gradient(180deg,#f4c95d,#d9a233);padding:.75rem 2rem;
  font-size:clamp(1rem,2vw,1.5rem);border-radius:999px;letter-spacing:.04em;
  box-shadow:0 6px 0 #8a6418,0 10px 22px rgba(0,0,0,.4);display:none;}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6418;}
.resultCard{background:linear-gradient(180deg,#241a52,#141c3c);border:2px solid rgba(244,201,93,.45);
  border-radius:20px;padding:clamp(1.2rem,3vw,2.2rem);width:min(760px,94vw);
  max-height:94vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.55);}
.pfRow{display:flex;flex-wrap:nowrap;gap:2%;justify-content:center;}
.pfRow>div{width:31%;}
.pfRow img{width:100%;height:auto;border-radius:8px;border:2px solid #f4c95d;display:block;}
.orderGrid{display:grid;grid-template-columns:1fr 1fr;column-gap:1.4rem;text-align:left;}
@media (max-width:520px){.orderGrid{grid-template-columns:1fr;}}
.resultCard h2{font-family:'Luckiest Guy',cursive;color:#f4c95d;
  font-size:clamp(1.5rem,3.5vw,2.4rem);margin-bottom:.9rem;}
.rrow{display:flex;align-items:center;gap:.6rem;padding:.28rem .15rem;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:clamp(.8rem,1.4vw,1rem);}
.rrow .pos{font-family:'Luckiest Guy',cursive;color:#f4c95d;width:2em;}
.rrow .swatch{width:.85em;height:.85em;border-radius:3px;flex-shrink:0;}
.rrow .nm{font-weight:600;color:#e9eefc;}
.credit{margin-top:1rem;font-size:.72rem;color:#7884a8;line-height:1.4;}
</style>

    text-shadow:0 2px 6px rgba(0,0,0,.8)">Drag to rotate · Pinch to zoom</div>
  <div style="position:fixed;bottom:0;left:0;right:0;background:rgba(13,21,48,.92);
    border-top:1px solid rgba(255,100,100,.4);padding:12px 16px 20px;font-family:'Fredoka';pointer-events:auto">
    <div style="display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:6px 8px;color:#fff;font-size:.88rem">
      <label>Forward ↔</label>
      <input type="range" id="cZ" min="-2" max="2" step="0.02" value="0.50" style="accent-color:#f4c95d;width:100%">
      <span id="cZv" style="text-align:right;font-variant-numeric:tabular-nums;color:#f4c95d">0.50</span>
      <label>Up ↕ Down</label>
      <input type="range" id="cY" min="-2" max="2" step="0.02" value="-0.20" style="accent-color:#f4c95d;width:100%">
      <span id="cYv" style="text-align:right;font-variant-numeric:tabular-nums;color:#f4c95d">-0.20</span>
      <label>Left ↔ Right</label>
      <input type="range" id="cX" min="-2" max="2" step="0.02" value="0.00" style="accent-color:#f4c95d;width:100%">
      <span id="cXv" style="text-align:right;font-variant-numeric:tabular-nums;color:#f4c95d">0.00</span>
    </div>
    <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="font-size:.72rem;color:#7884a8">
        Tell Claude: x=<b id="cOutX" style="color:#fff">0.00</b>
        y=<b id="cOutY" style="color:#fff">-0.20</b>
        z=<b id="cOutZ" style="color:#fff">0.50</b>
      </div>
      <button onclick="document.getElementById('calOverlay').style.display='none'"
        style="font-family:'Fredoka';font-weight:700;border:none;background:#f4c95d;color:#1a1340;
        padding:.4rem 1.2rem;border-radius:999px;cursor:pointer;font-size:.9rem">✓ Done</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
window.onerror=function(msg,src,line){
  document.body.innerHTML+='<div style="position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:12px;font-size:14px;z-index:999;word-break:break-all">ERROR line '+line+': '+msg+'</div>';
  return false;
};
(function(){
const VERSION='v8.5';
const NAMES=['Dasher','Dancer','Prancer','Vixen','Comet','Cupid','Donner','Blitzen','Rudolph'];
const COLORS=['#c47a3a','#b86d45','#d49050','#a05c2e','#c88048','#b07040','#d4a060','#985030','#e03020'];
// Racing silks — one distinct colour per reindeer (elf coat + saddle cloth + name tag + results)
const SILKS=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#ec407a','#f5f5f5'];
const ELF_COLORS=SILKS;
const N=9, LANE_W=1.6, BASE_SPEED=3.0;

// ── OVAL TRACK GEOMETRY ───────────────────────────────────────────────────────
// Layout: homestretch on right (X=+TR), backstretch on left (X=-TR)
// Reindeer run counterclockwise viewed from above (US racing standard).
// Visual scale kept small so deer are visible; race runs 1.25 laps = 1.25 miles
const STR  = 320;                       // straight length (m)
const TR   = 120;                       // turn radius (m)
const CIRC = 2*STR + 2*Math.PI*TR;     // full lap ≈ 1394m
const TW   = 14;                        // track width (m)

// Segment arc-length boundaries
const S1 = STR;
const S2 = STR + Math.PI*TR;
const S3 = 2*STR + Math.PI*TR;
const S4 = CIRC;

// Race layout — gate on homestretch, finish line 0.25 miles ahead (CCW)
// With reversed direction: homestretch traversed at p≈0.75–1.0
// Gate at top of homestretch = p=0.75; finish line at p=1.0 (≡ p=0)
const P_GATE   = 0.75;                  // spawn progress (top of homestretch)
const P_FINISH = P_GATE + 1.25;        // finish at cumulative p=2.0 (1.25 miles)

/**
 * Returns {x, z, ry} for a deer at fractional lap progress p (0..1)
 * with laneOff metres to the right of the centreline.
 */
function trackPos(p, laneOff){
  const u  = 1.0 - (((p % 1) + 1) % 1);  // reversed: progress runs 1→0 = counterclockwise
  const d  = u * CIRC;   // distance along track (m)
  let px, pz, tx, tz;    // centre-line position & unit tangent

  if(d < S1){
    // Homestretch: X = +TR, Z increases 0 → STR
    const t = d / STR;
    px = TR;  pz = t * STR;
    tx = 0;   tz = 1;

  } else if(d < S2){
    // Top turn: semicircle centred at (0, 0, STR), angle 0 → π
    const a = (d - S1) / (Math.PI * TR);   // 0..1
    const ang = a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = STR + Math.sin(ang) * TR;
    tx = -Math.sin(ang);   // tangent dx/d(ang) (normalised)
    tz =  Math.cos(ang);

  } else if(d < S3){
    // Backstretch: X = -TR, Z decreases STR → 0
    const t = (d - S2) / STR;
    px = -TR;  pz = STR - t * STR;
    tx = 0;    tz = -1;

  } else {
    // Bottom turn: semicircle centred at (0, 0, 0), angle π → 2π
    const a = (d - S3) / (Math.PI * TR);   // 0..1
    const ang = Math.PI + a * Math.PI;
    px = Math.cos(ang) * TR;
    pz = Math.sin(ang) * TR;
    tx = -Math.sin(ang);
    tz =  Math.cos(ang);
  }

  // Right normal = (tz, 0, -tx)  →  positive laneOff moves outward
  return {
    x  : px + tz * laneOff,
    z  : pz - tx * laneOff,
    ry : Math.atan2(tx, tz) + Math.PI   // +π flips facing to match reversed travel direction
  };
}

// Rudolph nose offset (tune with calibration panel)
let noseOff = {x:0.00, y:-0.76, z:-0.02};
const TC_X = 0, TC_Z = STR / 2;

// ── ENGINE GLOBALS ────────────────────────────────────────────────────────────
let scene, camera, renderer, clock;
let deerObjs=new Array(N).fill(null), deerLoaded=0, deerScale=1, autoScaleDone=false;
let racing=false, raceTime=0, finishCounter=0, finishedAll=false, postTimer=0;
let paused=false;
let speedMult=1;
// ── RACE ANNOUNCER (Web Speech API — no audio assets needed) ──
const ann={on:true, lastCall:0, lastLeadIdx:-1, lastLeadT:-10, flags:{}, voice:null};
// The default system voice is usually the flattest one installed. Hunt for a
// livelier one — Google's US English (Android/Chrome) reads with real intonation.
function pickVoice(){
  try{
    if(!window.speechSynthesis) return;
    const vs=speechSynthesis.getVoices();
    if(!vs.length) return;
    ann.voice =
      vs.find(v=>/Google US English/i.test(v.name)) ||
      vs.find(v=>/en[-_]US/i.test(v.lang) && /Google/i.test(v.name)) ||
      vs.find(v=>/en[-_]US/i.test(v.lang) && /natural|neural|online/i.test(v.name)) ||
      vs.find(v=>/en[-_]US/i.test(v.lang)) ||
      vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}
function say(txt, opts={}){
  if(!ann.on) return;
  try{
    if(!window.speechSynthesis) return;
    if(opts.force) speechSynthesis.cancel();
    else if(speechSynthesis.speaking) return;
    const u=new SpeechSynthesisUtterance(txt);
    if(ann.voice) u.voice=ann.voice;
    u.rate=opts.rate||1.15; u.pitch=opts.pitch||1.05; u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function announcerUpdate(){
  if(!racing) return;
  const ld=leader(); if(!ld) return;
  const frac=(ld.progress-P_GATE)/1.25;
  const F=ann.flags;
  // Excitement escalates with the race — faster and higher as they get closer to home
  const exR=1.02+frac*0.42, exP=0.98+frac*0.36;
  // ── landmark calls, varied phrasing ──
  if(!F.q1 && frac>=0.15){ F.q1=true;
    say(pick([`${ld.name} breaks on top as they head into the first turn!`,
      `Into the first turn, and it's ${ld.name} showing the way!`]),{rate:exR,pitch:exP}); }
  if(!F.back && frac>=0.30){ F.back=true;
    say(pick(['Down the backstretch they go!',
      'They hit the backstretch — and the pace is HOT!',
      `Down the back side, ${ld.name} clinging to the lead!`]),{rate:exR,pitch:exP}); }
  if(!F.half && frac>=0.50){ F.half=true;
    const t2=topN(2);
    say(pick([`Halfway home! ${t2[0].name} and ${t2[1].name} are putting on a show!`,
      `At the half, it's ${t2[0].name}! But this pack is TIGHT!`]),{rate:exR,pitch:exP}); }
  if(!F.far && frac>=0.68){ F.far=true;
    say(pick(['Around the final turn — here they come!',
      'They lean into the final turn! Hold onto your hats!',
      `Final turn! ${ld.name} in front, but ANYBODY can win this!`]),{force:true,rate:exR,pitch:exP}); }
  if(!F.stretch && frac>=0.85){ F.stretch=true;
    const t2=topN(2);
    say(pick([`DOWN THE STRETCH THEY COME! It's ${t2[0].name} and ${t2[1]?t2[1].name:''}!`,
      `They turn for home! ${t2[0].name} digs in — ${t2[1]?t2[1].name:''} won't go away!`]),{force:true,rate:1.42,pitch:1.32}); }
  if(!F.duel && frac>=0.93){ F.duel=true;
    const t2=topN(2);
    if(t2.length>1) say(`It's ${t2[0].name}! It's ${t2[1].name}! Side by side! To the wire!`,{force:true,rate:1.45,pitch:1.35}); }
  if(!F.closer && dramaCloser && !dramaCloser.finished && frac>=0.83){ F.closer=true;
    say(pick([`WAIT — here comes ${dramaCloser.name}, FLYING on the outside!`,
      `${dramaCloser.name} has found another gear! What a run!`,
      `Out of NOWHERE — ${dramaCloser.name} is charging down the middle of the track!`]),{force:true,rate:1.42,pitch:1.32}); }
  // ── lead changes ──
  const li=deerObjs.indexOf(ld);
  if(li!==ann.lastLeadIdx){
    if(ann.lastLeadIdx>=0 && frac>0.06 && frac<0.80 && raceTime-ann.lastLeadT>4){
      say(pick([`${ld.name} takes the lead!`,
        `And now it's ${ld.name} in front!`,
        `${ld.name} surges to the front!`,
        `${ld.name} says not so fast — and takes over!`]),{rate:exR,pitch:exP});
      ann.lastLeadT=raceTime;
    }
    ann.lastLeadIdx=li;
  }
  // ── periodic colour calls with gap description (a length ≈ 2.5m) ──
  if(frac>0.08 && frac<0.66 && raceTime-ann.lastCall>7){
    ann.lastCall=raceTime;
    const t2=topN(2);
    if(t2.length>1){
      const gapM=(t2[0].progress-t2[1].progress)*CIRC;
      const gapTxt = gapM<1.5 ? pick(['nose to nose','neck and neck','locked together'])
        : gapM<4 ? 'by a length'
        : `by ${Math.round(gapM/2.5)} lengths`;
      say(pick([`${t2[0].name} leads ${t2[1].name}, ${gapTxt}!`,
        `It's ${t2[0].name} and ${t2[1].name}, ${gapTxt}!`,
        `${t2[0].name} out front ${gapTxt}, ${t2[1].name} stalking!`]),{rate:exR,pitch:exP});
    }
  }
  // ── winner + placings ──
  if(!F.win && finishCounter>0){ F.win=true;
    const w=raceWinner();
    if(w===grinch) say(pick(['THE GRINCH STEALS THE RACE! UNBELIEVABLE!',
      'The Grinch WINS IT! You hate to see it, folks!']),{force:true,rate:1.28,pitch:1.22});
    else if(w) say(pick([`${w.name}! ${w.name} WINS IT!`,
      `${w.name} gets there! What! A! Finish!`,
      `At the wire — it's ${w.name}! Oh my goodness!`]),{force:true,rate:1.35,pitch:1.3});
  }
  if(!F.placed && finishCounter>=3){ F.placed=true;
    const p2=deerObjs.find(d=>d&&d.place===2)||( grinch&&grinch.place===2?grinch:null);
    const p3=deerObjs.find(d=>d&&d.place===3);
    if(p2&&p3) say(`${p2.name} takes second, ${p3.name} holds on for third!`,{rate:1.15,pitch:1.1});
  }
}
let dramaCloser=null;  // the designated come-from-behind runner this race
let dramaCloserWins=true; // ~80% of races the charge gets there; sometimes a nose short
let raceCount=0, grinchRace=false;  // every 3rd race the Grinch steals it
let grinch=null;  // built lazily on the first Grinch race
let activeCam='auto';  // the camera actually rendering this frame (resolves 'auto' picks)
// INSTANT REPLAY — race state recorded ~30fps from the final turn to the wire
let replayFrames=[], replayRec=false, replayActive=false, replayT=0, lastRecT=-1;

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x8aadd4);
  scene.fog = new THREE.Fog(0x8aadd4, 120, 560);

  camera = new THREE.PerspectiveCamera(54, innerWidth/innerHeight, 0.1, 1200);
  camera.position.copy(camPos);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding  = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type  = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xd4eaff, 0x6a7a90, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d6, 1.3);
  sun.position.set(-55, 65, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -110; sun.shadow.camera.right  = 110;
  sun.shadow.camera.top  =  110; sun.shadow.camera.bottom = -110;
  sun.shadow.camera.near = 1;    sun.shadow.camera.far    = 600;
  scene.add(sun);

  buildGround();
  buildScenery();
  // INFIELD — green oval interior. Use full circles at each end + wide rect to fill gaps.
  {
    const infM=new THREE.MeshStandardMaterial({color:0x2d7a1a,roughness:.9});
    const ri=TR-TW/2+0.5; // inner infield radius — overlaps under inner curb, no brown gap
    // Central rectangle spanning the two straights (full width between turn centres)
    const rect=new THREE.Mesh(new THREE.BoxGeometry(ri*2,0.05,STR),infM);
    rect.position.set(0,0.02,STR/2);
    scene.add(rect);
    // Full circles at each turn centre (not semicircles) to guarantee no gaps
    const botGeo=new THREE.CylinderGeometry(ri,ri,0.05,64);
    const bot=new THREE.Mesh(botGeo,infM);
    bot.position.set(0,0.02,0);
    scene.add(bot);
    const topGeo=new THREE.CylinderGeometry(ri,ri,0.05,64);
    const top=new THREE.Mesh(topGeo,infM);
    top.position.set(0,0.02,STR);
    scene.add(top);
  }
  buildStartingGate();
  buildSnow();
  loadAllDeer();        // ← start loading models immediately
  buildOvalTrack();     // ← build track geometry after

  document.querySelectorAll('.camBar button').forEach(b=>b.addEventListener('click',()=>{
    camMode = b.dataset.cam;
    document.querySelectorAll('.camBar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }));
  startBtn.addEventListener('click', beginRace);

  // Nose calibration panel — wires sliders to noseOff and updates display
  function wireCalSliders(){
    [['cX','x'],['cY','y'],['cZ','z']].forEach(([id,axis])=>{
      const sl=document.getElementById(id);
      const vl=document.getElementById(id.replace('c','c')+'v'); // cXv etc
      sl.addEventListener('input',e=>{
        const v=parseFloat(e.target.value);
        noseOff[axis]=v;
        document.getElementById(id+'v').textContent=v.toFixed(2);
        document.getElementById('cOut'+id[1].toUpperCase()).textContent=v.toFixed(2);
      });
    });
  }
  wireCalSliders();

  // Calibration button — opens dedicated Rudolph-only scene
  document.getElementById('calBtn').addEventListener('click',()=>{
    const rud=deerObjs[8];
    if(!rud){ alert('Still loading — try again in a moment.'); return; }
    openCalibration(rud);
  });
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
}

// ── GROUND ────────────────────────────────────────────────────────────────────
function buildGround(){
  const g = new THREE.Mesh(
    new THREE.PlaneGeometry(2400, 2400),
    new THREE.MeshStandardMaterial({color: 0x6b4423, roughness: 0.95}) // rich dirt brown
  );
  g.rotation.x = -Math.PI/2;
  g.position.set(TC_X, 0, TC_Z);  // centre on the oval so the far turn is never off the edge
  g.receiveShadow = true;
  scene.add(g);
}

// ── OVAL TRACK VISUAL ─────────────────────────────────────────────────────────
function buildOvalTrack(){
  fenceGroup = new THREE.Group();  // all posts + rails — hidden during photo-finish capture
  scene.add(fenceGroup);
  const railMat  = new THREE.MeshStandardMaterial({color:0x222222,roughness:.3});
  const postMat  = new THREE.MeshStandardMaterial({color:0xcc3344,roughness:.4,emissive:0x881122,emissiveIntensity:.5});
  const curbMat  = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.2,emissive:0xffffff,emissiveIntensity:.8});
  const bannerMat= new THREE.MeshStandardMaterial({color:0x155724});
  const hw = TW/2 + 1.5;
  const nCurb = 400; // high segment count — smooth curb strip visible from blimp
  const nPosts = 160;

  // CURB STRIPS — wide flat white bands at ground level, clearly visible overhead
  for(let i=0;i<nCurb;i++){
    const u0=i/nCurb, u1=(i+1)/nCurb;
    [-hw, hw].forEach(off=>{
      const a=trackPos(u0,off), b=trackPos(u1,off);
      const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
      const dx=b.x-a.x, dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz)+.04;
      const curb=new THREE.Mesh(new THREE.BoxGeometry(len,.15,3.0),curbMat);
      curb.position.set(mx,.06,mz);
      curb.rotation.y=-Math.atan2(dz,dx);
      scene.add(curb);
    });
  }

  // FENCE: candy cane posts (red/white stripes + hook) + two white rails
  const whiteMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,emissive:0xffffff,emissiveIntensity:.15});
  const redMat   = new THREE.MeshStandardMaterial({color:0xcc1122,roughness:.4,emissive:0x880000,emissiveIntensity:.3});
  const caneRailMat = new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.25,emissive:0xffffff,emissiveIntensity:.2});

  function makeCandyCane(height, radius){
    const g = new THREE.Group();
    const nStripes = 6;
    const stripeH = height / (nStripes * 2);
    for(let s=0; s<nStripes*2; s++){
      const mat = s%2===0 ? redMat : whiteMat;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, stripeH, 8), mat);
      seg.position.y = s * stripeH + stripeH/2;
      g.add(seg);
    }
    // Crook: half-torus in a vertical plane forming an upside-down J.
    // Torus centred at (hookR, height, 0); arc runs from staff top (0,height)
    // up and over to (2*hookR, height) — hook opens toward local +X.
    const hookR = radius*3;
    const hookGeo = new THREE.TorusGeometry(hookR, radius*0.85, 8, 14, Math.PI);
    const hook = new THREE.Mesh(hookGeo, redMat);
    hook.position.set(hookR, height, 0);  // vertical XY plane — no extra rotation needed
    g.add(hook);
    return g;
  }

  for(let i=0;i<nPosts;i++){
    const u0=i/nPosts, u1=(i+1)/nPosts;
    [-hw, hw].forEach(off=>{
      const a=trackPos(u0,off), b=trackPos(u1,off);
      const cane = makeCandyCane(2.8, 0.22);
      cane.position.set(a.x, 0, a.z);
      // Hook must face AWAY from the horses (away from track surface):
      // radial direction from track centreline outward through this post.
      const c0=trackPos(u0,0);
      let ax=a.x-c0.x, az=a.z-c0.z;
      const al=Math.sqrt(ax*ax+az*az)||1; ax/=al; az/=al;
      // rotation.y = t maps local +X to world (cos t, 0, -sin t)
      cane.rotation.y = Math.atan2(-az, ax);
      fenceGroup.add(cane);
      const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
      const dx=b.x-a.x, dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz)+.05;
      [0.9, 2.1].forEach(ry=>{
        const rail=new THREE.Mesh(new THREE.BoxGeometry(len,.22,.38),caneRailMat);
        rail.position.set(mx,ry,mz);
        rail.rotation.y=-Math.atan2(dz,dx);
        fenceGroup.add(rail);
      });
    });
  }

  // Finish line gantry at progress=0
  const fp=trackPos(0,0);
  const fi=trackPos(0,-hw-1), fo=trackPos(0,hw+1);
  // Outside gantry pole (plain)
  {
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,9,10),postMat);
    pole.position.set(fo.x,4.5,fo.z); scene.add(pole);
    finishPoles.push(pole);
  }
  // INFIELD: iconic white finish post with gold ball — like Churchill Downs
  {
    const whiteM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
    const goldM =new THREE.MeshStandardMaterial({color:0xd4af37,roughness:.25,metalness:.6});
    const post=new THREE.Group();
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.42,.55,8,12),whiteM);
    col.position.y=4; post.add(col);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.35,12),whiteM);
    cap.position.y=8.15; post.add(cap);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(.42,14,14),goldM);
    ball.position.y=8.85; post.add(ball);
    post.position.set(fi.x,0,fi.z);
    scene.add(post);
    finishPoles.push(post);
  }
  // FINISH banner — bold red with white text, canvas texture
  const bcv=document.createElement('canvas'); bcv.width=512; bcv.height=96;
  const bcx=bcv.getContext('2d');
  bcx.fillStyle='#c62828'; bcx.fillRect(0,0,512,96);
  bcx.fillStyle='#fff'; bcx.font='bold 64px sans-serif';
  bcx.textAlign='center'; bcx.textBaseline='middle';
  bcx.fillText('FINISH',256,50);
  const banTex=new THREE.CanvasTexture(bcv);
  const ban=new THREE.Mesh(new THREE.BoxGeometry(TW+4,2.2,.25),
    new THREE.MeshBasicMaterial({map:banTex}));
  ban.position.set(fp.x,8.5,fp.z);
  ban.rotation.y=fp.ry;
  scene.add(ban);
  finishLineGroup.push(ban);
  // Checkered finish strip across the track — high contrast, unmissable
  const ccv=document.createElement('canvas'); ccv.width=256; ccv.height=64;
  const ccx=ccv.getContext('2d');
  for(let cx=0;cx<8;cx++) for(let cy=0;cy<2;cy++){
    ccx.fillStyle=(cx+cy)%2?'#ffffff':'#111111';
    ccx.fillRect(cx*32,cy*32,32,32);
  }
  const chkTex=new THREE.CanvasTexture(ccv);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(TW+4,.06,2.2),
    new THREE.MeshBasicMaterial({map:chkTex}));
  stripe.rotation.y=fp.ry;
  stripe.position.set(fp.x,.04,fp.z);
  scene.add(stripe);
  finishLineGroup.push(stripe);
}
